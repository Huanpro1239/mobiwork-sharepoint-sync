[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
  "src/scoring/*",
  "src/kpi/kpi_exporter.py",
  "src/score_kpi_pipeline.py",
  "src/run_score_kpi.py",
  "src/sharepoint_kpi_source.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
