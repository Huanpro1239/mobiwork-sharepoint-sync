version: 2
updates:
  # Monthly, grouped updates keep CI minutes low (one PR per ecosystem per month).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:30"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:45"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
