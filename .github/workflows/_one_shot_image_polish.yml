name: One-shot image reliability polish

on:
  push:
    branches:
      - fix/image-sync-reliability-polish
    paths:
      - '.github/workflows/_one_shot_image_polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/image-sync-reliability-polish
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Apply reliability polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "src/image_sync.py",
              '''    if content_type.startswith("image/"):\n        guessed = mimetypes.guess_extension(content_type) or ""\n        if guessed == ".jpe":\n            guessed = ".jpg"\n        return content_type, guessed or (suffix if suffix in _IMAGE_EXTENSIONS else ".jpg")\n    if suffix in _IMAGE_EXTENSIONS:\n        guessed_type = mimetypes.guess_type(f"x{suffix}")[0] or "application/octet-stream"\n        return guessed_type, suffix\n    return "application/octet-stream", ".jpg"\n''',
              '''    if content_type.startswith("image/"):\n        guessed = mimetypes.guess_extension(content_type) or ""\n        if guessed == ".jpe":\n            guessed = ".jpg"\n        return content_type, guessed or (suffix if suffix in _IMAGE_EXTENSIONS else ".jpg")\n\n    # An explicit non-image media type is stronger evidence than the URL suffix.\n    # This prevents HTML login/error pages served from a *.jpg URL from being\n    # persisted as fake images. Generic/missing types may still fall back to suffix.\n    if content_type and content_type not in {\n        "application/octet-stream",\n        "binary/octet-stream",\n    }:\n        return "application/octet-stream", ".jpg"\n    if suffix in _IMAGE_EXTENSIONS:\n        guessed_type = (\n            mimetypes.guess_type(f"x{suffix}")[0] or "application/octet-stream"\n        )\n        return guessed_type, suffix\n    return "application/octet-stream", ".jpg"\n''',
          )

          replace(
              "src/image_sync.py",
              '''    cursor = state.get("last_completed_sync_date") or state.get("last_successful_sync_date")\n    last_date = _parse_date(cursor)\n    if not last_date:\n        return floor\n    return max(floor, last_date - timedelta(days=1))\n''',
              '''    cursor = state.get("last_completed_sync_date") or state.get("last_successful_sync_date")\n    last_date = _parse_date(cursor)\n    retry_from_date = _parse_date(state.get("retry_from_date"))\n    if not last_date:\n        return max(floor, retry_from_date) if retry_from_date else floor\n\n    normal_start = max(floor, last_date - timedelta(days=1))\n    if retry_from_date is None:\n        return normal_start\n    return max(floor, min(normal_start, retry_from_date))\n''',
          )

          replace(
              "src/image_sync.py",
              '''    previous_successful = state.get("last_successful_sync_date") if state else None\n    run_status = "partial_failure" if failures else "success"\n    storage.upload_json(\n''',
              '''    previous_successful = state.get("last_successful_sync_date") if state else None\n    run_status = "partial_failure" if failures else "success"\n    retry_from_date = min((item["date"] for item in failures), default=None)\n    result["retry_from_date"] = retry_from_date\n    storage.upload_json(\n''',
          )

          replace(
              "src/image_sync.py",
              '''            "last_run_status": run_status,\n            "failed_count": len(failures),\n''',
              '''            "last_run_status": run_status,\n            "failed_count": len(failures),\n            "retry_from_date": retry_from_date,\n''',
          )

          test_path = Path("tests/test_image_sync.py")
          test_text = test_path.read_text(encoding="utf-8")
          marker = '''    def test_download_enforces_max_image_size(self):\n'''
          insertion = '''    def test_download_rejects_explicit_non_image_payload_even_with_jpg_suffix(self):\n        response = FakeResponse(\n            "https://dmsimages.mobiwork.vn/error.jpg",\n            b"<html><body>login required</body></html>",\n            content_type="text/html",\n        )\n        session = FakeDownloadSession(response)\n        source = FakeSource([], session=session)\n\n        with self.assertRaisesRegex(ValueError, "not a recognized image"):\n            _download_image(source, response.url, ImageSyncConfig())\n\n    def test_partial_failure_retry_cursor_is_not_lost(self):\n        self.assertEqual(\n            _resolve_start_date(\n                date(2026, 8, 29),\n                {\n                    "last_completed_sync_date": "2026-08-29",\n                    "last_successful_sync_date": "2026-08-28",\n                    "retry_from_date": "2026-08-20",\n                },\n            ),\n            date(2026, 8, 20),\n        )\n\n'''
          if marker not in test_text:
              raise SystemExit("test insertion marker not found")
          test_path.write_text(
              test_text.replace(marker, insertion + marker, 1),
              encoding="utf-8",
          )

          marker = '''    def test_remote_path_is_month_employee_customer_and_sanitized(self):\n'''
          insertion = '''    def test_partial_failure_persists_earliest_retry_date(self):\n        class FailingSession:\n            def get(self, url, **kwargs):\n                raise requests.ConnectionError("temporary image failure")\n\n        source = FakeSource(\n            [\n                {\n                    "_sync_date": "2026-08-20",\n                    "hinh_anh": "https://dmsimages.mobiwork.vn/fail.jpg",\n                    "ten_nhan_vien": "NV A",\n                    "ma_kh": "KH001",\n                    "stt_hinh": 1,\n                }\n            ],\n            session=FailingSession(),\n        )\n        storage = FakeStorage(\n            state={"last_completed_sync_date": "2026-08-19"}\n        )\n        cfg = ImageSyncConfig(max_download_retries=0)\n\n        result = run_image_sync(\n            reports=[self.report],\n            source=source,\n            storage=storage,\n            drive_id="drive",\n            dry_run=False,\n            today=date(2026, 8, 29),\n            cfg=cfg,\n        )\n\n        self.assertEqual(result["status"], "partial_failure")\n        self.assertEqual(result["retry_from_date"], "2026-08-20")\n        state_payload = storage.uploaded_json[-1][1]\n        self.assertEqual(state_payload["retry_from_date"], "2026-08-20")\n\n'''
          test_text = test_path.read_text(encoding="utf-8")
          if marker not in test_text:
              raise SystemExit("state test insertion marker not found")
          test_path.write_text(
              test_text.replace(marker, insertion + marker, 1),
              encoding="utf-8",
          )

          p = Path("docs/production-image-sync.md")
          text = p.read_text(encoding="utf-8")
          old = '''- `failed_count`: number of failed images in the last run.\n\nThe next automatic run uses a one-day overlap from `last_completed_sync_date` to cover late-arriving records without repeatedly scanning the complete two-month archive.\n'''
          new = '''- `failed_count`: number of failed images in the last run.\n- `retry_from_date`: earliest business date with an unresolved image failure, or `null`.\n\nThe next automatic run normally uses a one-day overlap from `last_completed_sync_date`. If a partial run contains an older failed image, `retry_from_date` temporarily widens the scan window so that failure is retried automatically until it succeeds or ages out of the rolling retention window.\n'''
          if old not in text:
              raise SystemExit("documentation marker not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate code and tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m compileall -q src tests
          ruff check src tests
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit polished implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/image_sync.py tests/test_image_sync.py docs/production-image-sync.md
          git commit -m 'fix: close image sync reliability edge cases'
          git push origin HEAD:fix/image-sync-reliability-polish
