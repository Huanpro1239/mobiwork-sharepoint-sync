name: Cleanup One-off Current Sync

on:
  workflow_run:
    workflows:
      - "One-off Current MobiWork Sync"
    types:
      - completed

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary one-off workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          delete_file() {
            local path="$1"
            local message="$2"
            local encoded
            encoded=$(python - "$path" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe="/"))
          PY
            )
            local meta
            meta=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/contents/$encoded?ref=main")
            local sha
            sha=$(echo "$meta" | jq -r '.sha')
            local payload
            payload=$(jq -n --arg message "$message" --arg sha "$sha" --arg branch "main" \
              '{message:$message, sha:$sha, branch:$branch}')
            curl --fail-with-body --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/contents/$encoded" \
              -d "$payload" >/dev/null
          }

          delete_file ".github/workflows/one-off-current-sync.yml" \
            "chore: remove completed one-off current sync workflow"
          delete_file ".github/workflows/cleanup-one-off-current-sync.yml" \
            "chore: remove one-off cleanup workflow"
