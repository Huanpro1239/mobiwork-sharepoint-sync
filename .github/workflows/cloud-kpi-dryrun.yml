name: Cloud KPI Dry Run Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloud-kpi-dryrun-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dry-run:
    if: ${{ github.event.pull_request.head.ref == 'feature/image-scoring-kpi-v24' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: src
      LOG_LEVEL: INFO
      AI_RUNTIME_MODE: cloud
      AI_DEVICE: cpu
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      EASYOCR_MODULE_PATH: ${{ github.workspace }}/.cache/easyocr

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ai.txt

      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/easyocr
          key: dms-ai-cpu-${{ runner.os }}-${{ hashFiles('requirements-ai.txt') }}

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ai.txt
          pip check

      - name: Validate legacy MediaPipe face API
        run: |
          python - <<'PY'
          import mediapipe as mp
          from scoring.face_detector import FaceDetector

          if not hasattr(mp, 'solutions'):
              raise SystemExit(
                  f'mediapipe {getattr(mp, "__version__", "unknown")} does not expose mp.solutions'
              )
          detector = FaceDetector()
          close = getattr(detector.detector, 'close', None)
          if callable(close):
              close()
          print(f'mediapipe_version={getattr(mp, "__version__", "unknown")}')
          print('face_detector_smoke=ok')
          PY

      - name: Compile implementation
        run: python -m compileall -q src

      - name: Explain cloud integration coverage
        run: |
          echo 'PR probes validate dependencies and code without Azure OIDC.'
          echo 'SharePoint end-to-end execution is covered by the trusted main-context probe.'
