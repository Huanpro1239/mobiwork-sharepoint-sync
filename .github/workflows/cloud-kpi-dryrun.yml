name: Cloud KPI Dry Run Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-kpi-dryrun-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dry-run:
    if: ${{ github.event.pull_request.head.ref == 'feature/image-scoring-kpi-v24' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: src
      LOG_LEVEL: INFO
      SHAREPOINT_HOST: vikodacomvn.sharepoint.com
      SHAREPOINT_SITE_PATH: /sites/Planning
      SHAREPOINT_LIBRARY: MobiWorkDMS
      SHAREPOINT_MAX_RETRIES: '6'
      SHAREPOINT_TIMEOUT_SECONDS: '120'
      IMAGE_ROOT_FOLDER: Data anh
      AI_RUNTIME_MODE: cloud
      AI_ASSET_DRIVE_ID: b!2K9oEC8dsUa6BquPvDyH35k3WNCRWItKlw8AJ2EKa5VahAhoPyTCQLc0Qsq_5UdO
      AI_SHAREPOINT_ASSET_ROOT: Chạy chương trình/KPI Assets
      AI_SYNC_ASSETS: 'false'
      AI_DEVICE: cpu
      KPI_SHAREPOINT_ROOT: KPI
      AI_DOWNLOAD_WORKERS: '8'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      EASYOCR_MODULE_PATH: ${{ github.workspace }}/.cache/easyocr

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ai.txt

      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/easyocr
          key: dms-ai-cpu-${{ runner.os }}-${{ hashFiles('requirements-ai.txt') }}

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ai.txt
          pip check

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve MobiWorkDMS drive
        run: |
          siteId=$(az rest --method get --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' --query id -o tsv)
          driveId=$(az rest --method get --url "https://graph.microsoft.com/v1.0/sites/$siteId/drives" --query "value[?tolower(name)=='mobiworkdms'].id | [0]" -o tsv)
          test -n "$driveId" || (echo 'MobiWorkDMS drive not found' && exit 2)
          echo "SHAREPOINT_DRIVE_ID=$driveId" >> "$GITHUB_ENV"

      - name: End-to-end KPI dry run for August 2026
        run: python src/run_score_kpi.py --period 2026-08 --dry-run

      - name: Validate workbook package and formulas
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path = Path('runtime/output/Ket_qua_cham_cong_va_thuong_KPI.xlsx')
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit('KPI workbook missing')
          with ZipFile(path) as zf:
              formulas = 0
              for name in zf.namelist():
                  if name.startswith('xl/worksheets/sheet') and name.endswith('.xml'):
                      formulas += zf.read(name).count(b'<f')
          print(f'workbook_bytes={path.stat().st_size}')
          print(f'formula_count={formulas}')
          if formulas < 100:
              raise SystemExit(f'Formula count too low: {formulas}')
          PY

      - name: Upload dry-run artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cloud-kpi-dryrun-${{ github.run_id }}
          path: runtime/output/
          if-no-files-found: warn
          retention-days: 14
