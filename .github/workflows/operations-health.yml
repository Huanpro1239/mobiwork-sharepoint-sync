name: MobiWork Operations Health

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */2 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: mobiwork-operations-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch recent production workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mobiwork-sync.yml/runs?branch=main&per_page=30" \
            > sync-runs.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mobiwork-images.yml/runs?branch=main&per_page=30" \
            > image-runs.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-smoke.yml/runs?branch=main&per_page=10" \
            > smoke-runs.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/commits?path=.github/workflows/production-smoke.yml&per_page=1" \
            > smoke-definition.json

      - name: Evaluate freshness and success
        id: evaluate
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)

          def parse_time(value):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def successful_ages(path):
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              ages = []
              for run in payload.get("workflow_runs", []):
                  if run.get("conclusion") != "success":
                      continue
                  finished = parse_time(run.get("updated_at") or run.get("created_at"))
                  if finished is None:
                      continue
                  ages.append((now - finished).total_seconds() / 60.0)
              return sorted(ages)

          def latest_completed(path):
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              completed = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("status") == "completed"
              ]
              if not completed:
                  return None
              completed.sort(
                  key=lambda run: run.get("updated_at") or run.get("created_at") or "",
                  reverse=True,
              )
              return completed[0]

          def smoke_definition_age_minutes():
              payload = json.loads(Path("smoke-definition.json").read_text(encoding="utf-8"))
              if not isinstance(payload, list) or not payload:
                  return None
              commit = payload[0].get("commit", {})
              committer = commit.get("committer", {}) if isinstance(commit, dict) else {}
              author = commit.get("author", {}) if isinstance(commit, dict) else {}
              created = parse_time(committer.get("date") or author.get("date"))
              if created is None:
                  return None
              return (now - created).total_seconds() / 60.0

          sync_ages = successful_ages("sync-runs.json")
          image_ages = successful_ages("image-runs.json")
          smoke_run = latest_completed("smoke-runs.json")
          definition_age = smoke_definition_age_minutes()
          reasons = []

          if not sync_ages:
              reasons.append("No successful MobiWork DMS Sync run was found in recent history.")
          elif sync_ages[0] > 150:
              reasons.append(
                  f"Latest successful MobiWork DMS Sync is {sync_ages[0]:.0f} minutes old (>150)."
              )

          if not image_ages:
              reasons.append("No successful MobiWork Images run was found in recent history.")
          elif image_ages[0] > 2160:
              reasons.append(
                  f"Latest successful MobiWork Images run is {image_ages[0] / 60:.1f} hours old (>36)."
              )

          smoke_age = -1.0
          smoke_conclusion = "missing"
          if smoke_run is None:
              if definition_age is not None and definition_age <= 2160:
                  smoke_conclusion = "bootstrap_grace"
              else:
                  reasons.append(
                      "No completed production consistency smoke run was found after the 36-hour bootstrap grace period."
                  )
          else:
              smoke_conclusion = str(smoke_run.get("conclusion") or "unknown")
              finished = parse_time(smoke_run.get("updated_at") or smoke_run.get("created_at"))
              if finished is not None:
                  smoke_age = (now - finished).total_seconds() / 60.0
              if smoke_conclusion != "success":
                  reasons.append(
                      "Latest production consistency smoke did not succeed: "
                      f"conclusion={smoke_conclusion}, url={smoke_run.get('html_url', '')}"
                  )
              elif smoke_age > 2160:
                  reasons.append(
                      f"Latest successful production consistency smoke is {smoke_age / 60:.1f} hours old (>36)."
                  )

          healthy = not reasons
          state = "healthy" if healthy else "unhealthy"
          Path("health.txt").write_text("\n".join(reasons), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"state={state}\n")
              handle.write(f"sync_age_minutes={(sync_ages[0] if sync_ages else -1):.1f}\n")
              handle.write(f"image_age_minutes={(image_ages[0] if image_ages else -1):.1f}\n")
              handle.write(f"smoke_age_minutes={smoke_age:.1f}\n")
              handle.write(f"smoke_conclusion={smoke_conclusion}\n")
              handle.write(
                  f"smoke_definition_age_minutes={(definition_age if definition_age is not None else -1):.1f}\n"
              )

          print(f"health={state}")
          for reason in reasons:
              print(f"- {reason}")
          raise SystemExit(0 if healthy else 1)
          PY
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update operational incident
        if: ${{ steps.evaluate.outputs.state == 'unhealthy' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[OPS] MobiWork automation unhealthy"
        shell: bash
        run: |
          set -euo pipefail
          details=$(cat health.txt)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(cat <<EOF
          Automated health watchdog detected an operational problem.

          ${details}

          Health run: ${run_url}
          Detected at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          )

          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title $ALERT_TITLE" \
            --json number,title \
            --jq '.[] | select(.title == env.ALERT_TITLE) | .number' \
            | head -n 1)

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Updated incident issue #$issue_number"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ALERT_TITLE" \
              --body "$body"
          fi

      - name: Close recovered operational incident
        if: ${{ steps.evaluate.outputs.state == 'healthy' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[OPS] MobiWork automation unhealthy"
        shell: bash
        run: |
          set -euo pipefail
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title $ALERT_TITLE" \
            --json number,title \
            --jq '.[] | select(.title == env.ALERT_TITLE) | .number' \
            | head -n 1)

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Automation recovered. Report sync, image sync, and production consistency smoke are healthy again."
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed
            echo "Closed recovered incident issue #$issue_number"
          else
            echo "No open operational incident."
          fi

      - name: Publish health summary
        if: ${{ always() }}
        env:
          STATE: ${{ steps.evaluate.outputs.state }}
          SYNC_AGE: ${{ steps.evaluate.outputs.sync_age_minutes }}
          IMAGE_AGE: ${{ steps.evaluate.outputs.image_age_minutes }}
          SMOKE_AGE: ${{ steps.evaluate.outputs.smoke_age_minutes }}
          SMOKE_CONCLUSION: ${{ steps.evaluate.outputs.smoke_conclusion }}
          SMOKE_DEFINITION_AGE: ${{ steps.evaluate.outputs.smoke_definition_age_minutes }}
        shell: bash
        run: |
          {
            echo "## MobiWork operations health"
            echo
            echo "- State: **${STATE:-unknown}**"
            echo "- Latest successful report sync age: **${SYNC_AGE:-unknown} min**"
            echo "- Latest successful image sync age: **${IMAGE_AGE:-unknown} min**"
            echo "- Latest production smoke: **${SMOKE_CONCLUSION:-unknown}**, age **${SMOKE_AGE:-unknown} min**"
            echo "- Smoke workflow definition age: **${SMOKE_DEFINITION_AGE:-unknown} min**"
            if [ -s health.txt ]; then
              echo
              echo "### Findings"
              sed 's/^/- /' health.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail watchdog when unhealthy
        if: ${{ steps.evaluate.outputs.state == 'unhealthy' }}
        run: exit 1
