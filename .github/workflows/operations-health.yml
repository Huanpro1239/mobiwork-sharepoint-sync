name: MobiWork Operations Health

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: mobiwork-operations-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch recent production workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mobiwork-sync.yml/runs?branch=main&per_page=30" \
            > sync-runs.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-smoke.yml/runs?branch=main&per_page=10" \
            > smoke-runs.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mobiwork-rebuild-month.yml/runs?branch=main&per_page=10" \
            > rebuild-runs.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/commits?path=.github/workflows/production-smoke.yml&per_page=1" \
            > smoke-definition.json

      - name: Evaluate freshness and success
        id: evaluate
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          # GitHub scheduled workflows are best-effort and can start materially
          # later than their cron slot. Report sync runs every 3 business hours plus
          # the 09:00 finalization and 23:30 nightly reconciliation, so a healthy
          # pipeline always has a success within the last ~10 hours at 08:20.
          # A fresh queued/in-progress run also suppresses a stale-success alert.
          SYNC_STALE_MINUTES = 720
          # Full-month rebuilds are queued weekly (Sunday) and at month close by
          # recovery-rebuild.yml. They share the production concurrency group, where
          # GitHub silently cancels an older *pending* run when a newer one queues, so
          # a cancelled or missing rebuild must be surfaced here instead of being lost.
          REBUILD_STALE_MINUTES = 8 * 24 * 60
          ACTIVE_RUN_GRACE_MINUTES = 90

          def parse_time(value):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def successful_ages(path):
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              ages = []
              for run in payload.get("workflow_runs", []):
                  if run.get("conclusion") != "success":
                      continue
                  finished = parse_time(run.get("updated_at") or run.get("created_at"))
                  if finished is None:
                      continue
                  ages.append((now - finished).total_seconds() / 60.0)
              return sorted(ages)

          def latest_active_age(path):
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              active_statuses = {"queued", "in_progress", "pending", "waiting", "requested"}
              ages = []
              for run in payload.get("workflow_runs", []):
                  if str(run.get("status") or "").casefold() not in active_statuses:
                      continue
                  started = parse_time(run.get("created_at") or run.get("updated_at"))
                  if started is None:
                      continue
                  ages.append((now - started).total_seconds() / 60.0)
              return min(ages) if ages else None

          def latest_completed(path):
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              completed = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("status") == "completed"
              ]
              if not completed:
                  return None
              completed.sort(
                  key=lambda run: run.get("updated_at") or run.get("created_at") or "",
                  reverse=True,
              )
              return completed[0]

          def smoke_definition_age_minutes():
              payload = json.loads(Path("smoke-definition.json").read_text(encoding="utf-8"))
              if not isinstance(payload, list) or not payload:
                  return None
              commit = payload[0].get("commit", {})
              committer = commit.get("committer", {}) if isinstance(commit, dict) else {}
              author = commit.get("author", {}) if isinstance(commit, dict) else {}
              created = parse_time(committer.get("date") or author.get("date"))
              if created is None:
                  return None
              return (now - created).total_seconds() / 60.0

          sync_ages = successful_ages("sync-runs.json")
          rebuild_ages = successful_ages("rebuild-runs.json")
          rebuild_active_age = latest_active_age("rebuild-runs.json")
          rebuild_run = latest_completed("rebuild-runs.json")
          sync_active_age = latest_active_age("sync-runs.json")
          smoke_run = latest_completed("smoke-runs.json")
          definition_age = smoke_definition_age_minutes()
          reasons = []

          has_fresh_active_sync = (
              sync_active_age is not None
              and sync_active_age <= ACTIVE_RUN_GRACE_MINUTES
          )
          if not sync_ages:
              if not has_fresh_active_sync:
                  reasons.append("No successful MobiWork DMS Sync run was found in recent history.")
          elif sync_ages[0] > SYNC_STALE_MINUTES and not has_fresh_active_sync:
              reasons.append(
                  "Latest successful MobiWork DMS Sync is "
                  f"{sync_ages[0]:.0f} minutes old (>{SYNC_STALE_MINUTES})."
              )

          smoke_age = -1.0
          smoke_conclusion = "missing"
          if smoke_run is None:
              if definition_age is not None and definition_age <= 2160:
                  smoke_conclusion = "bootstrap_grace"
              else:
                  reasons.append(
                      "No completed production consistency smoke run was found after the 36-hour bootstrap grace period."
                  )
          else:
              smoke_conclusion = str(smoke_run.get("conclusion") or "unknown")
              finished = parse_time(smoke_run.get("updated_at") or smoke_run.get("created_at"))
              if finished is not None:
                  smoke_age = (now - finished).total_seconds() / 60.0
              if smoke_conclusion != "success":
                  reasons.append(
                      "Latest production consistency smoke did not succeed: "
                      f"conclusion={smoke_conclusion}, url={smoke_run.get('html_url', '')}"
                  )
              elif smoke_age > 2160:
                  reasons.append(
                      f"Latest successful production consistency smoke is {smoke_age / 60:.1f} hours old (>36)."
                  )

          has_active_rebuild = (
              rebuild_active_age is not None
              and rebuild_active_age <= ACTIVE_RUN_GRACE_MINUTES
          )
          rebuild_conclusion = "missing"
          if rebuild_run is None:
              if not has_active_rebuild:
                  reasons.append("No completed MobiWork Full Month Rebuild run was found in recent history.")
          else:
              rebuild_conclusion = str(rebuild_run.get("conclusion") or "unknown")
              if rebuild_conclusion != "success" and not has_active_rebuild:
                  reasons.append(
                      "Latest MobiWork Full Month Rebuild did not succeed "
                      "(a pending run cancelled by the shared production lock also lands here): "
                      f"conclusion={rebuild_conclusion}, url={rebuild_run.get('html_url', '')}"
                  )
          if rebuild_run is not None and not has_active_rebuild and (
              not rebuild_ages or rebuild_ages[0] > REBUILD_STALE_MINUTES
          ):
              age_text = f"{rebuild_ages[0] / 1440:.1f} days old" if rebuild_ages else "missing"
              reasons.append(
                  "Latest successful MobiWork Full Month Rebuild is "
                  f"{age_text} (>{REBUILD_STALE_MINUTES // 1440} days)."
              )

          healthy = not reasons
          state = "healthy" if healthy else "unhealthy"
          Path("health.txt").write_text("\n".join(reasons), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"state={state}\n")
              handle.write(f"sync_age_minutes={(sync_ages[0] if sync_ages else -1):.1f}\n")
              handle.write(
                  f"sync_active_age_minutes={(sync_active_age if sync_active_age is not None else -1):.1f}\n"
              )
              handle.write(f"smoke_age_minutes={smoke_age:.1f}\n")
              handle.write(f"smoke_conclusion={smoke_conclusion}\n")
              handle.write(
                  f"rebuild_age_minutes={(rebuild_ages[0] if rebuild_ages else -1):.1f}\n"
              )
              handle.write(f"rebuild_conclusion={rebuild_conclusion}\n")
              handle.write(
                  f"smoke_definition_age_minutes={(definition_age if definition_age is not None else -1):.1f}\n"
              )

          print(f"health={state}")
          print(
              "sync="
              f"last_success_age={(sync_ages[0] if sync_ages else -1):.1f}m "
              f"active_age={(sync_active_age if sync_active_age is not None else -1):.1f}m "
              f"stale_limit={SYNC_STALE_MINUTES}m"
          )
          for reason in reasons:
              print(f"- {reason}")
          raise SystemExit(0 if healthy else 1)
          PY
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update operational incident
        if: ${{ steps.evaluate.outputs.state == 'unhealthy' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[OPS] MobiWork automation unhealthy"
        shell: bash
        run: |
          set -euo pipefail
          details=$(cat health.txt)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(cat <<EOF
          Automated health watchdog detected an operational problem.

          ${details}

          Health run: ${run_url}
          Detected at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          )

          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title $ALERT_TITLE" \
            --json number,title \
            --jq '.[] | select(.title == env.ALERT_TITLE) | .number' \
            | head -n 1)

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Updated incident issue #$issue_number"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ALERT_TITLE" \
              --body "$body"
          fi

      - name: Close recovered operational incident
        if: ${{ steps.evaluate.outputs.state == 'healthy' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[OPS] MobiWork automation unhealthy"
        shell: bash
        run: |
          set -euo pipefail
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title $ALERT_TITLE" \
            --json number,title \
            --jq '.[] | select(.title == env.ALERT_TITLE) | .number' \
            | head -n 1)

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Automation recovered. Report sync, full-month rebuild and production consistency smoke are healthy again."
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed
            echo "Closed recovered incident issue #$issue_number"
          else
            echo "No open operational incident."
          fi

      - name: Publish health summary
        if: ${{ always() }}
        env:
          STATE: ${{ steps.evaluate.outputs.state }}
          SYNC_AGE: ${{ steps.evaluate.outputs.sync_age_minutes }}
          SYNC_ACTIVE_AGE: ${{ steps.evaluate.outputs.sync_active_age_minutes }}
          SMOKE_AGE: ${{ steps.evaluate.outputs.smoke_age_minutes }}
          SMOKE_CONCLUSION: ${{ steps.evaluate.outputs.smoke_conclusion }}
          SMOKE_DEFINITION_AGE: ${{ steps.evaluate.outputs.smoke_definition_age_minutes }}
          REBUILD_AGE: ${{ steps.evaluate.outputs.rebuild_age_minutes }}
          REBUILD_CONCLUSION: ${{ steps.evaluate.outputs.rebuild_conclusion }}
        shell: bash
        run: |
          {
            echo "## MobiWork operations health"
            echo
            echo "- State: **${STATE:-unknown}**"
            echo "- Latest successful report sync age: **${SYNC_AGE:-unknown} min**"
            echo "- Active report sync age: **${SYNC_ACTIVE_AGE:-unknown} min**"
            echo "- Latest production smoke: **${SMOKE_CONCLUSION:-unknown}**, age **${SMOKE_AGE:-unknown} min**"
            echo "- Smoke workflow definition age: **${SMOKE_DEFINITION_AGE:-unknown} min**"
            echo "- Latest full-month rebuild: **${REBUILD_CONCLUSION:-unknown}**, last success age **${REBUILD_AGE:-unknown} min**"
            if [ -s health.txt ]; then
              echo
              echo "### Findings"
              sed 's/^/- /' health.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail watchdog when unhealthy
        if: ${{ steps.evaluate.outputs.state == 'unhealthy' }}
        run: exit 1
