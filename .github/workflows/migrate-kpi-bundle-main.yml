name: Migrate KPI Bundle V2.3 Main Context

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: migrate-kpi-bundle-v23
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'run migrate kpi bundle main-context') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      SHAREPOINT_HOST: vikodacomvn.sharepoint.com
      SHAREPOINT_SITE_PATH: /sites/Planning
      AI_ASSET_DRIVE_ID: b!2K9oEC8dsUa6BquPvDyH35k3WNCRWItKlw8AJ2EKa5VahAhoPyTCQLc0Qsq_5UdO
      AI_SHAREPOINT_ASSET_ROOT: Chạy chương trình/KPI Assets

    steps:
      - name: Checkout feature implementation
        uses: actions/checkout@v7
        with:
          ref: feature/image-scoring-kpi-v24

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ai.txt

      - name: Install migration runtime
        run: |
          python -m pip install --upgrade pip
          pip install 'torch>=2.4,<3' 'torchvision>=0.19,<1' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ai.txt
          pip check

      - name: Compile implementation
        run: python -m compileall -q src

      - name: Azure login with trusted main OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Download trusted legacy bundle
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from image_storage import ImageSharePointClient

          client = ImageSharePointClient.from_env()
          drive_id = os.environ['AI_ASSET_DRIVE_ID']
          root = os.environ['AI_SHAREPOINT_ASSET_ROOT'].strip('/')
          source = f'{root}/reference_bundle_v2.pkl'
          content = client.download_file_bytes(drive_id, source)
          if not content:
              raise SystemExit(f'Legacy bundle missing or empty: {source}')
          path = Path('runtime/migration/reference_bundle_v2.pkl')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(content)
          print(f'legacy_bundle={source} bytes={len(content)}')
          PY

      - name: Retrain and validate V2.3 heads
        run: |
          python src/migrate_prebuilt_bundle.py \
            runtime/migration/reference_bundle_v2.pkl \
            runtime/migration/reference_bundle_v23.pkl | tee runtime/migration/migration_report.txt

      - name: Verify candidate metadata
        run: |
          python - <<'PY'
          import pickle
          from pathlib import Path

          path = Path('runtime/migration/reference_bundle_v23.pkl')
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit('Migrated bundle missing')
          with path.open('rb') as handle:
              payload = pickle.load(handle)
          if str(payload.get('pipeline_version')) != '2.3.0':
              raise SystemExit(f"Unexpected pipeline version: {payload.get('pipeline_version')!r}")
          report = payload['evaluation_report']
          if not report.quality_gate_passed or not report.auto_fail_gate_passed:
              raise SystemExit('Migrated bundle failed quality gates after serialization')
          print(f'candidate_bytes={path.stat().st_size}')
          print(f'pipeline_version={payload["pipeline_version"]}')
          print(f'model_signature={payload["model_signature"]}')
          print(f'auto_pass_precision={report.auto_pass_precision:.6f}')
          print(f'auto_pass_coverage={report.auto_pass_coverage:.6f}')
          print(f'auto_fail_precision={report.auto_fail_precision:.6f}')
          print(f'auto_fail_count={report.auto_fail_count}')
          PY

      - name: Publish versioned V2.3 candidate to SharePoint
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from image_storage import ImageSharePointClient

          client = ImageSharePointClient.from_env()
          drive_id = os.environ['AI_ASSET_DRIVE_ID']
          root = os.environ['AI_SHAREPOINT_ASSET_ROOT'].strip('/')
          run_id = os.environ['GITHUB_RUN_ID']
          remote = f'{root}/reference_bundle_v23_{run_id}.pkl'
          path = Path('runtime/migration/reference_bundle_v23.pkl')
          client.upload_bytes(drive_id, remote, path.read_bytes(), 'application/octet-stream')
          item = client.get_item_by_path(drive_id, remote)
          if not item or 'folder' in item or int(item.get('size') or 0) != path.stat().st_size:
              raise RuntimeError(f'Versioned V2.3 bundle verification failed: {remote}')
          print(f'AI_PREBUILT_BUNDLE_REMOTE={Path(remote).name}')
          print(f'sharepoint_bundle={remote} bytes={item.get("size")}')
          PY

      - name: Upload migration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: kpi-bundle-v23-${{ github.run_id }}
          path: runtime/migration/
          if-no-files-found: warn
          retention-days: 30
