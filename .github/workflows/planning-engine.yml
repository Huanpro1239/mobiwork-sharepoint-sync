name: Vikoda Planning Engine

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Shadow calculation only; do not publish to SharePoint"
        required: true
        type: boolean
        default: true
  schedule:
    # Vietnam local time: 07:10, 11:10, 14:10, 17:10 Monday-Saturday.
    - cron: "10 7,11,14,17 * * 1-6"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: read
  id-token: write

concurrency:
  group: vikoda-planning-engine-production
  cancel-in-progress: false

jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration
        run: |
          test -f config/planning_sources.json
          python -m compileall -q src/planning src/run_planning_engine.py

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve Planning Shared Documents library
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID=$(az rest \
            --method get \
            --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' \
            --query id -o tsv)

          DRIVES=$(az rest \
            --method get \
            --url "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            --output json)

          DRIVE_ID=$(echo "$DRIVES" | jq -r '
            .value[]
            | select(
                (.webUrl | ascii_downcase | contains("/shared%20documents"))
                or (.webUrl | ascii_downcase | contains("/shared documents"))
              )
            | .id
          ' | head -n 1)

          if [ -z "$DRIVE_ID" ] || [ "$DRIVE_ID" = "null" ]; then
            echo "::error::Could not resolve the Planning /Shared Documents library."
            exit 1
          fi

          echo "SHAREPOINT_DRIVE_ID=$DRIVE_ID" >> "$GITHUB_ENV"
          echo "Planning Shared Documents drive resolved"

      - name: Run planning shadow engine
        env:
          PYTHONPATH: src
          SHAREPOINT_HOST: vikodacomvn.sharepoint.com
          SHAREPOINT_SITE_PATH: /sites/Planning
          SHAREPOINT_LIBRARY: "Tài liệu"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          SHAREPOINT_MAX_RETRIES: "6"
          PLANNING_CONFIG: config/planning_sources.json
          PLANNING_OUTPUT_DIR: output/planning
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python src/run_planning_engine.py

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("output/planning/planning_manifest.json")
          if not p.exists():
              raise SystemExit(0)
          m = json.loads(p.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Vikoda Planning Engine\n\n")
              f.write(f"- Status: **{m.get('status')}**\n")
              f.write(f"- Products: **{m.get('product_count', 0)}**\n")
              f.write(f"- Open PO rows: **{m.get('open_po_rows', 0)}**\n")
              f.write(f"- Scope: {m.get('scope', '')}\n")
          PY

      - name: Upload shadow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: planning-shadow-${{ github.run_id }}
          path: output/planning/
          if-no-files-found: ignore
          retention-days: 14
