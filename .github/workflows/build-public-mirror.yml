name: Build Sanitized Public Mirror

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout private source
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build sanitized mirror
        run: |
          python scripts/build_public_mirror.py \
            --output output/public-mirror \
            --public-repo Huanpro1239/mobiwork-sharepoint-etl

      - name: Validate public mirror
        working-directory: output/public-mirror
        run: |
          python -m compileall -q src tests
          ruff check .
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Package public mirror
        run: |
          cd output/public-mirror
          zip -qr ../mobiwork-sharepoint-etl.zip .

      - name: Upload sanitized mirror artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobiwork-sharepoint-etl-public-mirror-${{ github.run_id }}
          path: output/mobiwork-sharepoint-etl.zip
          if-no-files-found: error
          retention-days: 7
