name: Image Scoring + Sales KPI

on:
  push:
    branches: [main]
    paths:
      - ".github/kpi-production-now"
  workflow_dispatch:
    inputs:
      period:
        description: "Optional KPI month YYYY-MM; blank = current Vietnam month"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build and validate outputs without publishing KPI to SharePoint"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  actions: write

# A marker push means a newer production runtime should replace stale work.
# Self-dispatched catch-up batches must finish normally instead of cancelling the
# batch that created them.
concurrency:
  group: mobiwork-kpi-production
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  score-kpi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-ai.txt

      - name: Restore AI model caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/clip
            ~/.EasyOCR
            ~/.config/Ultralytics
          key: dms-ai-models-${{ runner.os }}-v3
          restore-keys: |
            dms-ai-models-${{ runner.os }}-v2

      - name: Install AI runtime dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the runtime-compatible NumPy first so the torch install does
          # not pull NumPy 2.x only to downgrade it a minute later.
          pip install 'numpy>=1.26,<2'
          pip install 'torch>=2.4,<3' 'torchvision>=0.19,<1' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ai.txt
          # YOLO-World otherwise performs this installation inside inference and
          # asks for a runtime restart. Pin the exact commit observed in production.
          pip install 'git+https://github.com/ultralytics/CLIP.git@a13192f8cb767260d7dfd98c843b0716593169e7'
          pip check

      - name: Validate AI runtime imports
        run: |
          python - <<'PY'
          import clip
          import easyocr
          import torch
          import torchvision
          print(f'torch={torch.__version__}')
          print(f'torchvision={torchvision.__version__}')
          print(f'easyocr={getattr(easyocr, "__version__", "unknown")}')
          print(f'clip={getattr(clip, "__version__", "installed")}')
          PY

      # Full unit/model regression tests belong to CI. Production only compiles
      # the runtime so each catch-up batch does not repeat the complete test suite.
      - name: Compile AI/KPI sources
        run: python -m compileall -q src/scoring src/kpi src/score_kpi_pipeline.py src/run_score_kpi_cloud.py

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint libraries
        run: |
          site_id=$(az rest --method get --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' --query id -o tsv)
          az rest --method get --url "https://graph.microsoft.com/v1.0/sites/$site_id/drives" > drives.json
          data_drive=$(jq -r '.value[] | select((.name | ascii_downcase) == "mobiworkdms") | .id' drives.json | head -n 1)
          asset_drive=$(jq -r '.value[] | select(((.name // "") | ascii_downcase) == "documents" or ((.name // "") | ascii_downcase) == "shared documents" or ((.name // "") | ascii_downcase) == "tài liệu" or ((.webUrl // "") | ascii_downcase | contains("shared%20documents")) or ((.webUrl // "") | ascii_downcase | contains("shared documents"))) | .id' drives.json | head -n 1)
          test -n "$data_drive" || { echo "MobiWorkDMS drive not found"; exit 1; }
          test -n "$asset_drive" || { echo "Shared Documents drive not found"; cat drives.json; exit 1; }
          echo "SHAREPOINT_DRIVE_ID=$data_drive" >> "$GITHUB_ENV"
          echo "AI_ASSET_DRIVE_ID=$asset_drive" >> "$GITHUB_ENV"

      - name: Score stored images and publish KPI
        env:
          LOG_LEVEL: INFO
          SHAREPOINT_HOST: vikodacomvn.sharepoint.com
          SHAREPOINT_SITE_PATH: /sites/Planning
          SHAREPOINT_LIBRARY: MobiWorkDMS
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          IMAGE_ROOT_FOLDER: Data anh
          AI_SHAREPOINT_ASSET_ROOT: Chạy chương trình/KPI Assets
          AI_PREBUILT_BUNDLE: "true"
          AI_PREBUILT_BUNDLE_REMOTE: reference_bundle_v23_33357852900.pkl
          AI_SYNC_ASSETS: "false"
          AI_DEVICE: cpu
          # 1,000 unique URLs keeps each CPU batch bounded while halving the
          # number of runner/model startups versus the 500-image emergency cap.
          AI_PRODUCTION_MAX_PENDING_IMAGES: "1000"
          AI_PRODUCTION_MAX_TECHNICAL_RETRIES: "3"
          # Eight simultaneous Graph reads caused repeated 429 throttling in the
          # measured production run. Four workers trades a little raw concurrency
          # for steadier end-to-end throughput.
          AI_DOWNLOAD_WORKERS: "4"
          KPI_SHAREPOINT_ROOT: KPI
          KPI_PERIOD: ${{ github.event_name == 'workflow_dispatch' && inputs.period || '' }}
          KPI_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          args=()
          if [ -n "$KPI_PERIOD" ]; then
            args+=(--period "$KPI_PERIOD")
          fi
          if [ "$KPI_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python src/run_score_kpi_cloud.py "${args[@]}"

      - name: Publish AI/KPI summary
        if: ${{ always() }}
        run: |
          path="runtime/output/run_manifest.json"
          [ -f "$path" ] || exit 0
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("runtime/output/run_manifest.json").read_text(encoding="utf-8"))
          scoring = data.get('scoring', {})
          lines = [
              "## Image Scoring + Sales KPI",
              "",
              f"- Status: **{data.get('status')}**",
              f"- Dry run: **{data.get('dry_run')}**",
              f"- KPI period: **{data.get('period')}**",
              f"- Image rows / unique URLs: **{scoring.get('images')} / {scoring.get('unique_images', 0)}**",
              f"- Legacy auto reused (unique): **{scoring.get('legacy_auto_reused_unique', 0)}**",
              f"- Legacy queued for V2.3 rescore (unique): **{scoring.get('legacy_rescore_candidates_unique', 0)}**",
              f"- V2.3 checkpoint hits (unique): **{scoring.get('current_model_reused_unique', 0)}**",
              f"- Batch attempted (unique): **{scoring.get('production_batch_scored_unique', 0)}**",
              f"- Backlog remaining (unique): **{scoring.get('production_pending_remaining_unique', 0)}**",
              f"- Stored image rows / unique URLs loaded: **{scoring.get('stored_images_loaded')} / {scoring.get('stored_images_loaded_unique', 0)}**",
              f"- Cache hits: **{scoring.get('cache_hits')}**",
              f"- New unique scores: **{scoring.get('new_unique_scores')}**",
              f"- Manual review required / resolved: **{scoring.get('manual_review_required_count', 0)} / {scoring.get('manual_review_resolved_count', 0)}**",
              f"- Pending AI / technical failures: **{scoring.get('pending_score_count', 0)} / {scoring.get('technical_failure_count', 0)}**",
              f"- Current-model auto-pass rate: **{scoring.get('current_model_auto_pass_rate', 0):.2%}**",
              f"- KPI customers: **{data.get('customers_in_kpi')}**",
              f"- KPI employees: **{data.get('employees_in_kpi')}**",
              f"- Pipeline signature: `{data.get('pipeline_signature')}`",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

      - name: Continue production catch-up
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path="runtime/output/run_manifest.json"
          [ -f "$path" ] || exit 0
          status=$(jq -r '.status // ""' "$path")
          # jq's // treats boolean false as absent; preserve an explicit false.
          dry_run=$(jq -r 'if has("dry_run") then (.dry_run | tostring) else "true" end' "$path")
          pending=$(jq -r '.scoring.production_pending_remaining_unique // .scoring.production_pending_remaining // 0' "$path")
          period=$(jq -r '.period // ""' "$path")
          if [ "$status" = "warming_up" ] && [ "$dry_run" = "false" ] && [ "$pending" -gt 0 ]; then
            echo "Queueing next production scoring batch for $period"
            jq -n --arg period "$period" '{ref:"main",inputs:{period:$period,dry_run:"false"}}' \
              | gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/image-scoring-kpi.yml/dispatches" \
                  --input -
          fi

      - name: Upload AI/KPI artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-scoring-kpi-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/output/
          if-no-files-found: ignore
          retention-days: 30
