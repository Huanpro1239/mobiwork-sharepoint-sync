name: MobiWork Image Sync Run Now

on:
  push:
    branches:
      - main
    paths:
      - .run-image-sync-now

permissions:
  contents: read
  id-token: write

concurrency:
  group: mobiwork-sharepoint-image-production
  cancel-in-progress: false

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Validate MobiWork secrets
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOBIWORK_USER" || { echo "::error::MOBIWORK_USER is missing"; exit 1; }
          test -n "$MOBIWORK_TOKEN" || { echo "::error::MOBIWORK_TOKEN is missing"; exit 1; }

      - name: Validate Microsoft OIDC configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID" || { echo "::error::AZURE_CLIENT_ID is missing"; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "::error::AZURE_TENANT_ID is missing"; exit 1; }

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint document library
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID=$(az rest \
            --method get \
            --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' \
            --query id -o tsv)
          DRIVES=$(az rest \
            --method get \
            --url "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            --output json)
          DRIVE_ID=$(echo "$DRIVES" | jq -r '.value[] | select((.name | ascii_downcase) == "mobiworkdms") | .id' | head -n 1)
          test -n "$DRIVE_ID" && test "$DRIVE_ID" != "null" || { echo "::error::MobiWorkDMS drive not found"; exit 1; }
          echo "SHAREPOINT_DRIVE_ID=$DRIVE_ID" >> "$GITHUB_ENV"

      - name: Sync rolling two-month images production
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          MOBIWORK_MIN_INTERVAL_SECONDS: "1.5"
          MOBIWORK_MAX_RETRIES: "8"
          MOBIWORK_TIMEOUT_SECONDS: "120"
          SHAREPOINT_HOST: "vikodacomvn.sharepoint.com"
          SHAREPOINT_SITE_PATH: "/sites/Planning"
          SHAREPOINT_LIBRARY: "MobiWorkDMS"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          IMAGE_SYNC_ENABLED: "true"
          IMAGE_SOURCE_REPORT: "visit"
          IMAGE_ROOT_FOLDER: "Data anh"
          IMAGE_URL_FIELD: "hinh_anh"
          IMAGE_DATE_FIELD: "ngay"
          IMAGE_EMPLOYEE_FIELD: "ten_nhan_vien"
          IMAGE_CUSTOMER_FIELD: "ma_kh"
          IMAGE_SEQUENCE_FIELD: "stt_hinh"
          IMAGE_REQUIRE_GHI_TON: "false"
          IMAGE_REQUEST_TIMEOUT_SECONDS: "120"
          IMAGE_MAX_DOWNLOAD_RETRIES: "3"
          DRY_RUN: "false"
        run: python src/run_images.py

      - name: Upload image sync manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mobiwork-image-sync-run-now-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/image_sync_manifest.json
          if-no-files-found: ignore
          retention-days: 14
