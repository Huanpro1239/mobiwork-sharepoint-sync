name: MobiWork DMS Sync

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Number of previous days to refresh"
        required: true
        default: "3"
      dry_run:
        description: "Fetch/export only; do not upload to SharePoint"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "7 6 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate MobiWork secrets
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
        shell: bash
        run: |
          missing=0
          if [ -z "$MOBIWORK_USER" ]; then
            echo "::error::MOBIWORK_USER/MOBIWORK_USER_ID is missing or unavailable to this workflow. Create it under Settings > Secrets and variables > Actions > Repository secrets."
            missing=1
          else
            echo "MOBIWORK_USER: available"
          fi
          if [ -z "$MOBIWORK_TOKEN" ]; then
            echo "::error::MOBIWORK_TOKEN is missing or unavailable to this workflow. Create it under Settings > Secrets and variables > Actions > Repository secrets."
            missing=1
          else
            echo "MOBIWORK_TOKEN: available"
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate Microsoft OIDC configuration
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          missing=0
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::error::AZURE_CLIENT_ID is missing. Create it under Settings > Secrets and variables > Actions > Repository secrets."
            missing=1
          else
            echo "AZURE_CLIENT_ID: available"
          fi
          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::AZURE_TENANT_ID is missing. Create it under Settings > Secrets and variables > Actions > Repository secrets."
            missing=1
          else
            echo "AZURE_TENANT_ID: available"
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Azure login with GitHub OIDC
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Validate Microsoft Graph access to Planning
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        shell: bash
        run: |
          az rest \
            --method get \
            --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id,displayName,webUrl' \
            --output json

      - name: Show SharePoint target drive
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID=$(az rest \
            --method get \
            --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' \
            --query id -o tsv)
          echo "Planning site id: $SITE_ID"

          DRIVES=$(az rest \
            --method get \
            --url "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            --output json)

          echo "Document libraries returned by Graph:"
          echo "$DRIVES" | jq -r '.value[] | "- name=\(.name) id=\(.id) webUrl=\(.webUrl)"'

          DRIVE_ID=$(echo "$DRIVES" | jq -r '.value[] | select((.name | ascii_downcase) == "mobiworkdms") | .id' | head -n 1)
          if [ -z "$DRIVE_ID" ] || [ "$DRIVE_ID" = "null" ]; then
            echo "::error::Microsoft Graph did not return a document library named MobiWorkDMS."
            exit 1
          fi
          echo "MobiWorkDMS drive id: $DRIVE_ID"
          echo "SHAREPOINT_DRIVE_ID=$DRIVE_ID" >> "$GITHUB_ENV"

      - name: Sync MobiWork reports
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          SHAREPOINT_HOST: "vikodacomvn.sharepoint.com"
          SHAREPOINT_SITE_PATH: "/sites/Planning"
          SHAREPOINT_LIBRARY: "MobiWorkDMS"
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '3' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python src/main.py

      - name: Verify SharePoint upload
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHAREPOINT_DRIVE_ID:-}" ]; then
            echo "::error::SHAREPOINT_DRIVE_ID was not resolved."
            exit 1
          fi

          CHILDREN=$(az rest \
            --method get \
            --url "https://graph.microsoft.com/v1.0/drives/$SHAREPOINT_DRIVE_ID/root/children" \
            --output json)

          echo "MobiWorkDMS root contents after sync:"
          echo "$CHILDREN" | jq -r '.value[] | "- name=\(.name) webUrl=\(.webUrl)"'
          COUNT=$(echo "$CHILDREN" | jq '.value | length')
          echo "Root item count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Sync finished but MobiWorkDMS is still empty according to Microsoft Graph."
            exit 1
          fi

      - name: Upload dry-run Excel artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: mobiwork-dry-run-output
          path: output/*.xlsx
          if-no-files-found: ignore
          retention-days: 3
