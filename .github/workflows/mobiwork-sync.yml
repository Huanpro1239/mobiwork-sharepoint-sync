name: MobiWork DMS Sync

on:
  workflow_dispatch:
    inputs:
      report_scope:
        description: "Routine sync, or rebuild promotion detail for every existing Bill month"
        required: true
        type: choice
        options:
          - all_reports
          - promotion_history
          - promotion_api_audit
          - promotion_bonus_only
        default: all_reports
      bonus_from_date:
        description: "Promotion Bonus requested from date (YYYY-MM-DD; default current month)"
        type: string
        default: ""
      bonus_to_date:
        description: "Promotion Bonus requested to date (YYYY-MM-DD; default month end)"
        type: string
        default: ""
      bonus_program:
        description: "Promotion Bonus program ID or all"
        type: string
        default: "all"
      bonus_sttt_probe:
        description: "Optional explicit documented sttt probe value; meaning unverified"
        type: string
        default: ""
      bonus_date_variants:
        description: "Audit only: report date probes (id_only,epoch_ui,epoch_full_day,ddmmyyyy)"
        type: string
        default: "id_only,epoch_ui,epoch_full_day,ddmmyyyy"
      sync_scope:
        description: "Target: today, yesterday, or previous N days"
        required: true
        type: choice
        options:
          - today
          - yesterday
          - lookback
          - month_to_date
        default: today
      lookback_days:
        description: "Used only when sync_scope=lookback"
        required: true
        default: "1"
      dry_run:
        description: "Fetch/export only; do not upload to SharePoint"
        required: true
        type: boolean
        default: false
  schedule:
    # Intraday refresh every 3 hours during business hours, Monday-Saturday.
    # Completed days are finalized at 09:00 and reconciled nightly (D-1..D-3).
    - cron: "5 7-19/3 * * 1-6"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "0 9 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: read
  id-token: write

# Serialize SharePoint production writes. GitHub Actions supports only `group`
# and `cancel-in-progress` in this block; keeping cancellation false protects the
# active report run while a newer pending refresh may coalesce older work.
concurrency:
  group: mobiwork-sharepoint-production
  cancel-in-progress: false

# Production SharePoint target. Override with repository variables
# (Settings → Secrets and variables → Actions → Variables) instead of editing
# every workflow; the literals are the current production defaults.
env:
  SHAREPOINT_HOST: ${{ vars.SHAREPOINT_HOST || 'vikodacomvn.sharepoint.com' }}
  SHAREPOINT_SITE_PATH: ${{ vars.SHAREPOINT_SITE_PATH || '/sites/Planning' }}
  SHAREPOINT_LIBRARY: ${{ vars.SHAREPOINT_LIBRARY || 'MobiWorkDMS' }}
  # Python Graph clients mint a fresh GitHub OIDC assertion per token request
  # (see src/sharepoint.py) so long runs never outlive the azure/login assertion.
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
  MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
  MOBIWORK_MIN_INTERVAL_SECONDS: "1.5"
  MOBIWORK_MAX_RETRIES: "8"
  MOBIWORK_TIMEOUT_SECONDS: "120"
  SHAREPOINT_MAX_RETRIES: "6"
  SHAREPOINT_TIMEOUT_SECONDS: "120"
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Production preflight
        run: |
          # Unit tests run in CI on every change; production runs only verify
          # that sources compile and the report config is usable.
          python -m compileall -q src
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("config/reports.json").read_text(encoding="utf-8"))
          reports = payload.get("reports")
          if not isinstance(reports, list) or not any(item.get("enabled") for item in reports):
              raise SystemExit("No enabled reports in config/reports.json")
          print(f"Enabled reports: {sum(bool(item.get('enabled')) for item in reports)}")
          PY

      - name: Resolve sync target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCOPE: ${{ inputs.sync_scope }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "5 7-19/3 * * 1-6" ]; then
              scope="today"
            else
              scope="yesterday"
            fi
          else
            scope="${INPUT_SCOPE:-today}"
          fi
          echo "SYNC_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "Resolved sync scope: $scope"

      - name: Validate MobiWork secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$MOBIWORK_USER" ]; then
            echo "::error::MOBIWORK_USER/MOBIWORK_USER_ID is missing or unavailable."
            missing=1
          fi
          if [ -z "$MOBIWORK_TOKEN" ]; then
            echo "::error::MOBIWORK_TOKEN is missing or unavailable."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "MobiWork credentials: available"

      - name: Validate Microsoft OIDC configuration
        if: ${{ github.event_name == 'schedule' || (inputs.dry_run == false && inputs.report_scope != 'promotion_api_audit') || inputs.report_scope == 'promotion_history' }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::error::AZURE_CLIENT_ID is missing."
            missing=1
          fi
          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::AZURE_TENANT_ID is missing."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Microsoft OIDC configuration: available"

      - name: Azure login with GitHub OIDC
        if: ${{ github.event_name == 'schedule' || (inputs.dry_run == false && inputs.report_scope != 'promotion_api_audit') || inputs.report_scope == 'promotion_history' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint document library
        if: ${{ github.event_name == 'schedule' || (inputs.dry_run == false && inputs.report_scope != 'promotion_api_audit') || inputs.report_scope == 'promotion_history' }}
        uses: ./.github/actions/resolve-sharepoint-drive

      - name: Sync all MobiWork reports
        if: ${{ github.event_name == 'schedule' || inputs.report_scope == 'all_reports' }}
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SYNC_SCOPE: ${{ env.SYNC_SCOPE }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '1' }}
        run: python src/run_all_reports.py

      - name: Build Data cham anh workbook
        if: ${{ github.event_name == 'schedule' || (inputs.dry_run == false && inputs.report_scope == 'all_reports') }}
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SYNC_SCOPE: ${{ env.SYNC_SCOPE }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '1' }}
          DATA_CHAM_ANH_ROOT_FOLDER: "05_DataChamAnh"
          # Intraday refreshes skip the full-month rebuild when no monthly master
          # changed. The 09:00 finalization and manual runs always rebuild.
          DATA_CHAM_ANH_SKIP_WHEN_UNCHANGED: ${{ github.event_name == 'schedule' && env.SYNC_SCOPE == 'today' }}
        run: python src/run_data_cham_anh.py

      - name: Sync Promotion Bonus current snapshot
        if: ${{ github.event_name == 'schedule' || inputs.report_scope == 'all_reports' || inputs.report_scope == 'promotion_bonus_only' }}
        id: promotion_bonus
        env:
          PROMOTION_BONUS_REQUIRE_DMS_MATCH: ${{ inputs.report_scope == 'promotion_bonus_only' && 'true' || 'false' }}
          PROMOTION_BONUS_FROM_DATE: ${{ inputs.bonus_from_date }}
          PROMOTION_BONUS_TO_DATE: ${{ inputs.bonus_to_date }}
          PROMOTION_BONUS_PROGRAM: ${{ inputs.bonus_program }}
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
        run: python src/promotion_bonus.py

      - name: Audit PromotionBonusReport API
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.report_scope == 'promotion_api_audit' }}
        env:
          PROMOTION_BONUS_FROM_DATE: ${{ inputs.bonus_from_date }}
          PROMOTION_BONUS_TO_DATE: ${{ inputs.bonus_to_date }}
          PROMOTION_BONUS_PROGRAM: ${{ inputs.bonus_program }}
          PROMOTION_BONUS_STTT: ${{ inputs.bonus_sttt_probe }}
          PROMOTION_BONUS_DATE_VARIANTS: ${{ inputs.bonus_date_variants }}
        run: python src/promotion_api_audit.py

      - name: Build promotion detail report
        if: ${{ github.event_name == 'schedule' || inputs.report_scope == 'all_reports' || inputs.report_scope == 'promotion_history' }}
        id: promotion_detail
        env:
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SYNC_SCOPE: ${{ env.SYNC_SCOPE }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '1' }}
          PROMOTION_DETAIL_SCOPE: ${{ inputs.report_scope == 'promotion_history' && 'all_existing' || 'touched' }}
        run: python src/promotion_detail.py

      - name: Publish run summary
        if: ${{ always() }}
        shell: bash
        env:
          PROMOTION_BONUS_OUTCOME: ${{ steps.promotion_bonus.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = []
          sync_path = Path("output/sync_manifest.json")
          if sync_path.exists():
              data = json.loads(sync_path.read_text(encoding="utf-8"))
              lines.extend([
                  "## MobiWork DMS Sync",
                  "",
                  f"- Status: **{data.get('status', 'unknown')}**",
                  f"- Sync scope: `{data.get('sync_scope', '')}`",
                  f"- Run ID: `{data.get('run_id', '')}`",
                  f"- Target report-date executions: **{data.get('target_execution_count', 0)}**",
                  f"- Successful report executions: **{data.get('successful_report_count', 0)}**",
                  f"- Failed report executions: **{data.get('failed_report_count', 0)}**",
                  f"- Workbook groups prepared: **{data.get('workbook_group_count', data.get('file_count', 0))}**",
                  f"- SharePoint writes performed: **{data.get('sharepoint_write_count', 0)}**",
                  f"- SharePoint writes avoided: **{data.get('sharepoint_write_avoided_count', 0)}**",
                  f"- Current-run source rows: **{data.get('source_row_count', 0):,}**",
                  f"- Rows stored in prepared monthly masters: **{data.get('master_row_count', 0):,}**",
              ])
              if data.get("error"):
                  lines.append(f"- Error summary: `{data['error']}`")
              if data.get("audit_upload_error"):
                  lines.append(f"- Audit upload error: `{data['audit_upload_error']}`")

              results = data.get("report_results", [])
              if results:
                  lines.extend([
                      "",
                      "| Date | Report | Status | Source rows | Master rows | Write | Verification | File |",
                      "|---|---|---|---:|---:|---|---|---|",
                  ])
                  for item in results:
                      filename = item.get("filename", "")
                      web_url = item.get("web_url")
                      file_cell = f"[{filename}]({web_url})" if web_url else filename
                      if data.get("dry_run"):
                          write_state = "dry-run"
                      elif item.get("upload_skipped"):
                          write_state = "avoided"
                      elif item.get("status") == "success" and filename:
                          write_state = "written"
                      else:
                          write_state = ""
                      lines.append(
                          f"| {item.get('target_date', '')} | {item.get('report', '')} | "
                          f"{item.get('status', '')} | {int(item.get('source_rows', 0)):,} | "
                          f"{int(item.get('master_rows', 0)):,} | {write_state} | "
                          f"{item.get('verification_mode', '')} | {file_cell} |"
                      )
                      if item.get("error"):
                          lines.append(f"|  | ↳ error |  |  |  |  |  | `{item['error']}` |")

          bonus_path = Path("output/promotion_bonus_manifest.json")
          bonus = json.loads(bonus_path.read_text(encoding="utf-8")) if bonus_path.exists() else {}
          lines.extend(["", "## Promotion Bonus Snapshot", "", "| Metric | Value |", "|---|---|"])
          for label, key in [
              ("Status", "status"), ("Programs", "program_count"),
              ("Data rows", "data_row_count"), ("Target rows", "target_row_count"),
              ("Reward rows", "reward_row_count"), ("Workbook bytes", "workbook_bytes"),
              ("Dry run", "dry_run"),
          ]:
              fallback = os.environ.get("PROMOTION_BONUS_OUTCOME", "not run") if key == "status" else "—"
              lines.append(f"| {label} | {bonus.get(key, fallback)} |")
          if bonus.get("error"):
              lines.append(f"- Promotion Bonus error: `{bonus['error']}`")

          detail_path = Path("output/promotion_detail_manifest.json")
          if detail_path.exists():
              detail = json.loads(detail_path.read_text(encoding="utf-8"))
              lines.extend(["", "## Promotion detail report", "",
                            f"- Status: **{detail.get('status', 'unknown')}**",
                            f"- SharePoint publish enabled: **{detail.get('publish_enabled', False)}**"])
              lines.append(f"- Source months: {', '.join(detail.get('source_months', []))}")
              lines.append(f"- Incomplete detail publication allowed this run: **{detail.get('allow_incomplete_publish', False)}**")
              if detail.get("customer_catalogue"):
                  catalogue = detail["customer_catalogue"]
                  lines.append(f"- Customer catalogue: {catalogue['count']} IDs; {catalogue['unkeyed_rows']} rows without ID; join={catalogue['join_key']}")
              for result in detail.get("results", []):
                  lines.append(f"- {result['month']}: {result['rows']} rows; {result['issues']} missing mappings/values; source={result['source_scope']}")
              if detail.get("error"):
                  lines.append(f"- Error: `{detail['error']}`")

          if lines:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload audit manifests
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobiwork-sync-manifests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/sync_manifest.json
            output/promotion_bonus_manifest.json
            output/promotion_api_audit.json
            output/promotion_detail_manifest.json
          if-no-files-found: ignore
          retention-days: 7

      # Authenticated DMS rows are production data even with DRY_RUN=true.
      # Keep workbooks on the runner/SharePoint; never upload them as artifacts.
