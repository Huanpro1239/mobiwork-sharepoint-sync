name: MobiWork DMS Sync

on:
  workflow_dispatch:
    inputs:
      sync_scope:
        description: "Target: today, yesterday, or previous N days"
        required: true
        type: choice
        options:
          - today
          - yesterday
          - lookback
        default: today
      lookback_days:
        description: "Used only when sync_scope=lookback"
        required: true
        default: "1"
      dry_run:
        description: "Fetch/export only; do not upload to SharePoint"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "5 * * * *"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "0 9 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: read
  id-token: write
  actions: write

# Serialize SharePoint production writes. GitHub Actions supports only `group`
# and `cancel-in-progress` in this block; keeping cancellation false protects the
# active report/image run while a newer pending refresh may coalesce older work.
concurrency:
  group: mobiwork-sharepoint-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Production preflight
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -p "test_mobiwork.py"
          python -m unittest discover -s tests -p "test_monthly_master.py"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("config/reports.json").read_text(encoding="utf-8"))
          reports = payload.get("reports")
          if not isinstance(reports, list) or not any(item.get("enabled") for item in reports):
              raise SystemExit("No enabled reports in config/reports.json")
          print(f"Enabled reports: {sum(bool(item.get('enabled')) for item in reports)}")
          PY

      - name: Resolve sync target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCOPE: ${{ inputs.sync_scope }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "5 * * * *" ]; then
              scope="today"
            else
              scope="yesterday"
            fi
          else
            scope="${INPUT_SCOPE:-today}"
          fi
          echo "SYNC_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "Resolved sync scope: $scope"

      - name: Validate MobiWork secrets
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$MOBIWORK_USER" ]; then
            echo "::error::MOBIWORK_USER/MOBIWORK_USER_ID is missing or unavailable."
            missing=1
          fi
          if [ -z "$MOBIWORK_TOKEN" ]; then
            echo "::error::MOBIWORK_TOKEN is missing or unavailable."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "MobiWork credentials: available"

      - name: Validate Microsoft OIDC configuration
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::error::AZURE_CLIENT_ID is missing."
            missing=1
          fi
          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::AZURE_TENANT_ID is missing."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Microsoft OIDC configuration: available"

      - name: Azure login with GitHub OIDC
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint document library
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID=$(az rest \
            --method get \
            --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' \
            --query id -o tsv)

          DRIVES=$(az rest \
            --method get \
            --url "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            --output json)

          DRIVE_ID=$(echo "$DRIVES" | jq -r '.value[] | select((.name | ascii_downcase) == "mobiworkdms") | .id' | head -n 1)
          if [ -z "$DRIVE_ID" ] || [ "$DRIVE_ID" = "null" ]; then
            echo "::error::Microsoft Graph did not return a document library named MobiWorkDMS."
            exit 1
          fi

          echo "Planning site id resolved"
          echo "MobiWorkDMS drive id resolved"
          echo "SHAREPOINT_DRIVE_ID=$DRIVE_ID" >> "$GITHUB_ENV"

      - name: Sync all MobiWork reports
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          MOBIWORK_MIN_INTERVAL_SECONDS: "1.5"
          MOBIWORK_MAX_RETRIES: "8"
          MOBIWORK_TIMEOUT_SECONDS: "120"
          SHAREPOINT_HOST: "vikodacomvn.sharepoint.com"
          SHAREPOINT_SITE_PATH: "/sites/Planning"
          SHAREPOINT_LIBRARY: "MobiWorkDMS"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          SYNC_SCOPE: ${{ env.SYNC_SCOPE }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '1' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python src/run_all_reports.py

      - name: Build Data cham anh workbook
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          SHAREPOINT_HOST: "vikodacomvn.sharepoint.com"
          SHAREPOINT_SITE_PATH: "/sites/Planning"
          SHAREPOINT_LIBRARY: "MobiWorkDMS"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          SYNC_SCOPE: ${{ env.SYNC_SCOPE }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '1' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          DATA_CHAM_ANH_ROOT_FOLDER: "05_DataChamAnh"
        run: python src/run_data_cham_anh.py

      - name: Queue image sync after successful production report refresh
        if: ${{ success() && ((github.event_name == 'schedule' && env.SYNC_SCOPE == 'yesterday') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SYNC_SCOPE_VALUE: ${{ env.SYNC_SCOPE }}
          LOOKBACK_DAYS_VALUE: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          from_date=""

          # Scheduled yesterday-finalization uses the persisted image state cursor.
          # Manual production runs force the image window to cover the report scope
          # that the operator just refreshed.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            from_date=$(python - "$SYNC_SCOPE_VALUE" "$LOOKBACK_DAYS_VALUE" <<'PY'
          import sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          scope = sys.argv[1]
          lookback = int(sys.argv[2])
          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          if scope == "today":
              target = today
          elif scope == "yesterday":
              target = today - timedelta(days=1)
          elif scope == "lookback":
              target = today - timedelta(days=lookback)
          else:
              raise SystemExit(f"Unsupported sync scope: {scope}")
          print(target.isoformat())
          PY
            )
          fi

          jq -n --arg from_date "$from_date" \
            '{ref:"main",inputs:{dry_run:"false",from_date:$from_date}}' \
            | gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/mobiwork-images.yml/dispatches" \
                --input -
          echo "Queued reliable image reconciliation from ${from_date:-state cursor}"

      - name: Publish run summary
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = []
          sync_path = Path("output/sync_manifest.json")
          if sync_path.exists():
              data = json.loads(sync_path.read_text(encoding="utf-8"))
              lines.extend([
                  "## MobiWork DMS Sync",
                  "",
                  f"- Status: **{data.get('status', 'unknown')}**",
                  f"- Sync scope: `{data.get('sync_scope', '')}`",
                  f"- Run ID: `{data.get('run_id', '')}`",
                  f"- Target report-date executions: **{data.get('target_execution_count', 0)}**",
                  f"- Successful report executions: **{data.get('successful_report_count', 0)}**",
                  f"- Failed report executions: **{data.get('failed_report_count', 0)}**",
                  f"- Workbook groups prepared: **{data.get('workbook_group_count', data.get('file_count', 0))}**",
                  f"- SharePoint writes performed: **{data.get('sharepoint_write_count', 0)}**",
                  f"- SharePoint writes avoided: **{data.get('sharepoint_write_avoided_count', 0)}**",
                  f"- Current-run source rows: **{data.get('source_row_count', 0):,}**",
                  f"- Rows stored in prepared monthly masters: **{data.get('master_row_count', 0):,}**",
              ])
              if data.get("error"):
                  lines.append(f"- Error summary: `{data['error']}`")
              if data.get("audit_upload_error"):
                  lines.append(f"- Audit upload error: `{data['audit_upload_error']}`")

              results = data.get("report_results", [])
              if results:
                  lines.extend([
                      "",
                      "| Date | Report | Status | Source rows | Master rows | Write | Verification | File |",
                      "|---|---|---|---:|---:|---|---|---|",
                  ])
                  for item in results:
                      filename = item.get("filename", "")
                      web_url = item.get("web_url")
                      file_cell = f"[{filename}]({web_url})" if web_url else filename
                      if data.get("dry_run"):
                          write_state = "dry-run"
                      elif item.get("upload_skipped"):
                          write_state = "avoided"
                      elif item.get("status") == "success" and filename:
                          write_state = "written"
                      else:
                          write_state = ""
                      lines.append(
                          f"| {item.get('target_date', '')} | {item.get('report', '')} | "
                          f"{item.get('status', '')} | {int(item.get('source_rows', 0)):,} | "
                          f"{int(item.get('master_rows', 0)):,} | {write_state} | "
                          f"{item.get('verification_mode', '')} | {file_cell} |"
                      )
                      if item.get("error"):
                          lines.append(f"|  | ↳ error |  |  |  |  |  | `{item['error']}` |")

          if lines:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload audit manifests
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mobiwork-sync-manifests-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/sync_manifest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload dry-run Excel artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        uses: actions/upload-artifact@v7
        with:
          name: mobiwork-dry-run-output-${{ github.run_id }}
          path: output/*.xlsx
          if-no-files-found: ignore
          retention-days: 3
