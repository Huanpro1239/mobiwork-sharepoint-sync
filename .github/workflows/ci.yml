name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: TEMP extract PromotionBonusReport schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://dms.mobiwork.vn/openapi/openapi.json?v=1.13"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 GitHubActions schema probe"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              spec = json.load(resp)

          found = []
          refs = set()
          for path, methods in spec.get("paths", {}).items():
              for method, op in methods.items():
                  if not isinstance(op, dict):
                      continue
                  if (
                      op.get("operationId") == "findPromotionBonusReport"
                      or "PromotionBonusReport" in op.get("tags", [])
                  ):
                      found.append({"path": path, "method": method.upper(), "operation": op})
                      blob = json.dumps(op)
                      for token in blob.split('"'):
                          if token.startswith("#/components/schemas/"):
                              refs.add(token.rsplit("/", 1)[-1])

          schemas = spec.get("components", {}).get("schemas", {})
          print("PROMOTION_BONUS_OPERATIONS=")
          print(json.dumps(found, ensure_ascii=False, indent=2))
          print("PROMOTION_BONUS_SCHEMAS=")
          print(json.dumps({name: schemas.get(name) for name in sorted(refs)}, ensure_ascii=False, indent=2))
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Ruff lint
        run: ruff check .

      - name: Unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
