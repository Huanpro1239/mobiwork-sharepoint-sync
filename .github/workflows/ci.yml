name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: TEMP probe MobiWork Swagger
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          base = "https://dms.mobiwork.vn"
          ui = base + "/openapi/"

          def fetch(url):
              print(f"--- FETCH {url}")
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 GitHubActions schema probe"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      print("STATUS", resp.status, "FINAL", resp.geturl(), "LEN", len(body))
                      print(body[:12000])
                      return body
              except Exception as exc:
                  print("ERROR", type(exc).__name__, exc)
                  return ""

          html = fetch(ui)
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I):
              fetch(urllib.parse.urljoin(ui, src))

          for path in [
              "/openapi/v3/api-docs",
              "/openapi/v2/api-docs",
              "/openapi/api-docs",
              "/openapi/swagger.json",
              "/openapi/openapi.json",
              "/v3/api-docs",
              "/v2/api-docs",
          ]:
              body = fetch(base + path)
              if "PromotionBonusReport" in body or "findPromotionBonusReport" in body:
                  print("FOUND_PROMOTION_BONUS_SCHEMA_AT", base + path)
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Ruff lint
        run: ruff check .

      - name: Unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
