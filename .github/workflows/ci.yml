name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: TEMP extract PromotionBonusReport schema
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request

          url = "https://dms.mobiwork.vn/openapi/openapi.json?v=1.13"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 GitHubActions schema probe"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              body = resp.read().decode("utf-8", "replace")

          for needle in ["findPromotionBonusReport", '"PromotionBonusReport"']:
              idx = body.find(needle)
              print(f"NEEDLE={needle} INDEX={idx}")
              if idx >= 0:
                  print(body[max(0, idx - 12000): idx + 22000])
                  print("END_PROMOTION_BONUS_SNIPPET")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Ruff lint
        run: ruff check .

      - name: Unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
