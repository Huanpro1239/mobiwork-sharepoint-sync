name: Grade DMS Visit Images

on:
  push:
    branches:
      - feature/grade-vieng-tham-images
    paths:
      - src/grade_visit_images.py
      - src/grade_visit_images_local.py
      - tests/test_grade_visit_images.py
      - requirements-vision.txt
      - .github/workflows/grade-vieng-tham-images.yml
  pull_request:
    branches:
      - main
    paths:
      - src/grade_visit_images.py
      - src/grade_visit_images_local.py
      - tests/test_grade_visit_images.py
      - requirements-vision.txt
      - .github/workflows/grade-vieng-tham-images.yml
  workflow_dispatch:
    inputs:
      max_rows:
        description: "Maximum new images to grade; blank means all pending"
        required: false
        default: ""
      local_batch_size:
        description: "Images per local CLIP inference batch"
        required: true
        default: "32"

permissions:
  contents: write

concurrency:
  group: grade-dms-visit-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      GRADE_LOCAL_MODEL: openai/clip-vit-base-patch32
      GRADE_LOCAL_BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.local_batch_size || '32' }}
      GRADE_DOWNLOAD_WORKERS: "12"
      # Push/PR is a safety smoke-test. Manual dispatch can grade all remaining rows.
      GRADE_MAX_ROWS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_rows || '20' }}
      GRADE_OUTPUT_PATH: results/vieng_tham_grading.csv

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-vision.txt

      - name: Install OCR runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-vision.txt

      - name: Run grading rule tests
        run: python -m unittest tests.test_grade_visit_images -v

      - name: Grade visit images locally
        run: python -m src.grade_visit_images_local

      - name: Commit grading checkpoint
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d results ]; then
            echo "No grading result directory produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/vieng_tham_grading.csv results/vieng_tham_grading.summary.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new grading checkpoint to commit."
            exit 0
          fi
          git commit -m "Update visit image grading checkpoint"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload grading checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vieng-tham-grading-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/vieng_tham_grading.csv
            results/vieng_tham_grading.summary.json
          if-no-files-found: ignore
          retention-days: 14
