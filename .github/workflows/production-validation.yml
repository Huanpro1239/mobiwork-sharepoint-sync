name: One-time Production Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/production-validation.trigger"

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: mobiwork-sharepoint-production
  cancel-in-progress: false

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Quality gate
        run: |
          python -m compileall -q src tests
          ruff check .
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Validate production secrets
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MOBIWORK_USER MOBIWORK_TOKEN AZURE_CLIENT_ID AZURE_TENANT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing or unavailable."
              exit 1
            fi
          done
          echo "Production credentials: available"

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint document library
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID=$(az rest \
            --method get \
            --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' \
            --query id -o tsv)

          DRIVES=$(az rest \
            --method get \
            --url "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            --output json)

          DRIVE_ID=$(echo "$DRIVES" | jq -r '.value[] | select((.name | ascii_downcase) == "mobiworkdms") | .id' | head -n 1)
          if [ -z "$DRIVE_ID" ] || [ "$DRIVE_ID" = "null" ]; then
            echo "::error::Microsoft Graph did not return a document library named MobiWorkDMS."
            exit 1
          fi

          echo "SHAREPOINT_DRIVE_ID=$DRIVE_ID" >> "$GITHUB_ENV"

      - name: Export previous-day visit workbook for binary probe
        env:
          PYTHONUNBUFFERED: "1"
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          MOBIWORK_MIN_INTERVAL_SECONDS: "1.5"
          MOBIWORK_MAX_RETRIES: "8"
          MOBIWORK_TIMEOUT_SECONDS: "120"
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from excel_export import export_excel
          from mobiwork import MobiWorkClient, ReportConfig

          payload = json.loads(Path("config/reports.json").read_text(encoding="utf-8"))
          raw = next(item for item in payload["reports"] if item["key"] == "visit")
          cfg = ReportConfig(**raw)
          target = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date() - timedelta(days=1)
          records = MobiWorkClient.from_env().fetch_report(cfg, target)
          path = export_excel(records, cfg.name, target, cfg.export_mode)
          info = {
              "target_date": target.isoformat(),
              "path": str(path),
              "rows": len(records),
              "size": path.stat().st_size,
          }
          Path("output/raw_probe_source.json").write_text(
              json.dumps(info, indent=2), encoding="utf-8"
          )
          print(f"Raw probe source: {info}")
          PY

      - name: Raw curl binary upload preflight
        id: raw_probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          TOKEN=$(az account get-access-token \
            --resource 'https://graph.microsoft.com/' \
            --query accessToken -o tsv)
          LOCAL=$(jq -r '.path' output/raw_probe_source.json)
          TARGET_DATE=$(jq -r '.target_date' output/raw_probe_source.json)
          PROBE_NAME="__raw_probe_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.xlsx"
          REMOTE_PATH="01_BaoCaoViengTham/${TARGET_DATE:0:4}/${TARGET_DATE:5:2}/${PROBE_NAME}"
          PUT_JSON=/tmp/raw-probe-put.json
          REMOTE_FILE=/tmp/raw-probe-remote.xlsx
          ITEM_ID=""

          cleanup() {
            if [ -n "$ITEM_ID" ]; then
              curl --silent --show-error \
                -X DELETE \
                -H "Authorization: Bearer $TOKEN" \
                "https://graph.microsoft.com/v1.0/drives/${SHAREPOINT_DRIVE_ID}/items/${ITEM_ID}" \
                -o /dev/null || true
            fi
          }
          trap cleanup EXIT

          LOCAL_SIZE=$(stat -c%s "$LOCAL")
          LOCAL_SHA=$(sha256sum "$LOCAL" | awk '{print $1}')
          echo "Raw probe local size=$LOCAL_SIZE sha256=$LOCAL_SHA"

          HTTP_CODE=$(curl --silent --show-error --fail-with-body \
            -o "$PUT_JSON" \
            -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' \
            -H "Content-Length: $LOCAL_SIZE" \
            --data-binary "@$LOCAL" \
            "https://graph.microsoft.com/v1.0/drives/${SHAREPOINT_DRIVE_ID}/root:/${REMOTE_PATH}:/content")

          ITEM_ID=$(jq -r '.id // empty' "$PUT_JSON")
          RETURNED_NAME=$(jq -r '.name // empty' "$PUT_JSON")
          RESPONSE_SIZE=$(jq -r '.size // -1' "$PUT_JSON")
          if [ -z "$ITEM_ID" ]; then
            echo "::error::Raw Graph PUT did not return an item id."
            cat "$PUT_JSON"
            exit 1
          fi
          echo "Raw PUT http=$HTTP_CODE name=$RETURNED_NAME id=$ITEM_ID response_size=$RESPONSE_SIZE"

          curl --silent --show-error --fail --location \
            -H "Authorization: Bearer $TOKEN" \
            "https://graph.microsoft.com/v1.0/drives/${SHAREPOINT_DRIVE_ID}/items/${ITEM_ID}/content" \
            -o "$REMOTE_FILE"

          REMOTE_SIZE=$(stat -c%s "$REMOTE_FILE")
          REMOTE_SHA=$(sha256sum "$REMOTE_FILE" | awk '{print $1}')
          echo "Raw probe remote size=$REMOTE_SIZE sha256=$REMOTE_SHA"

          python - "$HTTP_CODE" "$ITEM_ID" "$RETURNED_NAME" "$LOCAL_SIZE" "$RESPONSE_SIZE" "$REMOTE_SIZE" "$LOCAL_SHA" "$REMOTE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          keys = [
              "http_code", "item_id", "returned_name", "local_size",
              "response_size", "remote_size", "local_sha256", "remote_sha256"
          ]
          values = sys.argv[1:]
          data = dict(zip(keys, values, strict=True))
          for key in ("local_size", "response_size", "remote_size"):
              data[key] = int(data[key])
          data["match"] = (
              data["local_size"] == data["remote_size"]
              and data["local_sha256"] == data["remote_sha256"]
          )
          Path("output/raw_binary_probe.json").write_text(
              json.dumps(data, indent=2), encoding="utf-8"
          )
          print(json.dumps(data, indent=2))
          if not data["match"]:
              raise SystemExit("Raw curl binary upload/download hash mismatch")
          PY

      - name: Sync previous day production data
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          MOBIWORK_MIN_INTERVAL_SECONDS: "1.5"
          MOBIWORK_MAX_RETRIES: "8"
          MOBIWORK_TIMEOUT_SECONDS: "120"
          SHAREPOINT_HOST: "vikodacomvn.sharepoint.com"
          SHAREPOINT_SITE_PATH: "/sites/Planning"
          SHAREPOINT_LIBRARY: "MobiWorkDMS"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          SYNC_MODE: "incremental"
          LOOKBACK_DAYS: "1"
          DRY_RUN: "false"
        run: python src/main.py

      - name: Publish validation summary
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("output/sync_manifest.json")
          probe_path = Path("output/raw_binary_probe.json")
          lines = ["## One-time Production Validation", ""]
          if probe_path.exists():
              probe = json.loads(probe_path.read_text(encoding="utf-8"))
              lines.extend([
                  f"- Raw binary probe: **{'PASS' if probe.get('match') else 'FAIL'}**",
                  f"- Probe local/remote size: `{probe.get('local_size')}` / `{probe.get('remote_size')}`",
              ])
          if manifest_path.exists():
              data = json.loads(manifest_path.read_text(encoding="utf-8"))
              lines.extend([
                  f"- Status: **{data.get('status', 'unknown')}**",
                  f"- Run ID: `{data.get('run_id', '')}`",
                  f"- Files: **{data.get('file_count', len(data.get('files', [])))}**",
                  f"- Source rows: **{data.get('source_row_count', 0):,}**",
              ])
              if data.get("error"):
                  lines.append(f"- Error: `{data['error']}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: production-validation-diagnostics-${{ github.run_id }}
          path: |
            output/sync_manifest.json
            output/raw_binary_probe.json
            output/raw_probe_source.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish production validation commit status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json
          import shlex
          from pathlib import Path

          manifest_path = Path('output/sync_manifest.json')
          probe_path = Path('output/raw_binary_probe.json')
          probe = None
          if probe_path.exists():
              probe = json.loads(probe_path.read_text(encoding='utf-8'))

          if not manifest_path.exists():
              state = 'failure'
              if probe is None:
                  description = 'validation failed before raw binary probe completed'
              elif not probe.get('match'):
                  description = (
                      f"raw binary mismatch local={probe.get('local_size')} "
                      f"remote={probe.get('remote_size')}"
                  )
              else:
                  description = 'raw binary probe passed; production sync did not complete'
          else:
              data = json.loads(manifest_path.read_text(encoding='utf-8'))
              status = str(data.get('status', 'failed'))
              files = int(data.get('file_count', len(data.get('files', []))))
              rows = int(data.get('source_row_count', 0))
              if status == 'success':
                  state = 'success'
                  description = f'success files={files} rows={rows} raw_probe=pass'
              else:
                  state = 'failure'
                  error = str(data.get('error', 'sync failed')).replace('\n', ' ')[:90]
                  description = f'failure {error}'[:140]
          print(f'STATE={shlex.quote(state)}')
          print(f'DESCRIPTION={shlex.quote(description[:140])}')
          PY
          )"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="production-validation" \
            -f description="$DESCRIPTION" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
