name: One-time Production Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/production-validation.trigger"

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: mobiwork-sharepoint-production
  cancel-in-progress: false

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Quality gate
        run: |
          python -m compileall -q src tests
          ruff check .
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Validate production secrets
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MOBIWORK_USER MOBIWORK_TOKEN AZURE_CLIENT_ID AZURE_TENANT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing or unavailable."
              exit 1
            fi
          done
          echo "Production credentials: available"

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint document library
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID=$(az rest \
            --method get \
            --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' \
            --query id -o tsv)

          DRIVES=$(az rest \
            --method get \
            --url "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            --output json)

          DRIVE_ID=$(echo "$DRIVES" | jq -r '.value[] | select((.name | ascii_downcase) == "mobiworkdms") | .id' | head -n 1)
          if [ -z "$DRIVE_ID" ] || [ "$DRIVE_ID" = "null" ]; then
            echo "::error::Microsoft Graph did not return a document library named MobiWorkDMS."
            exit 1
          fi

          echo "SHAREPOINT_DRIVE_ID=$DRIVE_ID" >> "$GITHUB_ENV"

      - name: Sync previous day production data
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          MOBIWORK_MIN_INTERVAL_SECONDS: "1.5"
          MOBIWORK_MAX_RETRIES: "8"
          MOBIWORK_TIMEOUT_SECONDS: "120"
          SHAREPOINT_HOST: "vikodacomvn.sharepoint.com"
          SHAREPOINT_SITE_PATH: "/sites/Planning"
          SHAREPOINT_LIBRARY: "MobiWorkDMS"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          SYNC_MODE: "incremental"
          LOOKBACK_DAYS: "1"
          DRY_RUN: "false"
        run: python src/main.py

      - name: Publish validation summary
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/sync_manifest.json")
          if not path.exists():
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8"))
          lines = [
              "## One-time Production Validation",
              "",
              f"- Status: **{data.get('status', 'unknown')}**",
              f"- Run ID: `{data.get('run_id', '')}`",
              f"- Files: **{data.get('file_count', len(data.get('files', [])))}**",
              f"- Source rows: **{data.get('source_row_count', 0):,}**",
          ]
          if data.get("error"):
              lines.append(f"- Error: `{data['error']}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload validation manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: production-validation-manifest-${{ github.run_id }}
          path: output/sync_manifest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish production validation commit status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json
          import shlex
          from pathlib import Path

          path = Path('output/sync_manifest.json')
          if not path.exists():
              state = 'failure'
              description = 'validation failed: sync manifest missing'
          else:
              data = json.loads(path.read_text(encoding='utf-8'))
              status = str(data.get('status', 'failed'))
              files = int(data.get('file_count', len(data.get('files', []))))
              rows = int(data.get('source_row_count', 0))
              if status == 'success':
                  state = 'success'
                  description = f'success files={files} rows={rows}'
              else:
                  state = 'failure'
                  error = str(data.get('error', 'sync failed')).replace('\n', ' ')[:90]
                  description = f'failure {error}'[:140]
          print(f'STATE={shlex.quote(state)}')
          print(f'DESCRIPTION={shlex.quote(description[:140])}')
          PY
          )"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="production-validation" \
            -f description="$DESCRIPTION" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
