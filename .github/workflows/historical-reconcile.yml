name: MobiWork Historical Reconciliation

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: "First historical month to reconcile as YYYY-MM"
        required: true
        default: "2026-06"
      end_month:
        description: "Last month as YYYY-MM; blank means previous completed month"
        required: false
        default: ""
      dry_run:
        description: "Fetch/export only; do not upload to SharePoint"
        required: true
        type: boolean
        default: false
  # Manual only: weekly current-month rebuild + month-close previous-month rebuild
  # cover routine late edits. Run this to rescan all completed history on demand.

permissions:
  contents: read
  id-token: write

# Old completed months are reconciled sequentially under the same SharePoint writer
# lock. Never interrupt an active production writer; historical repair can wait.
concurrency:
  group: mobiwork-sharepoint-production
  cancel-in-progress: false

# Production SharePoint target. Override with repository variables
# (Settings → Secrets and variables → Actions → Variables) instead of editing
# every workflow; the literals are the current production defaults.
env:
  SHAREPOINT_HOST: ${{ vars.SHAREPOINT_HOST || 'vikodacomvn.sharepoint.com' }}
  SHAREPOINT_SITE_PATH: ${{ vars.SHAREPOINT_SITE_PATH || '/sites/Planning' }}
  SHAREPOINT_LIBRARY: ${{ vars.SHAREPOINT_LIBRARY || 'MobiWorkDMS' }}
  # Python Graph clients mint a fresh GitHub OIDC assertion per token request
  # (see src/sharepoint.py) so long runs never outlive the azure/login assertion.
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Historical reconciliation preflight
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p "test_mobiwork.py"
          python -m unittest discover -s tests -p "test_monthly_master.py"
          python -m unittest discover -s tests -p "test_rebuild_month.py"
          python -m unittest discover -s tests -p "test_reconcile_history.py"
          python -m unittest discover -s tests -p "test_data_cham_anh_export.py"
          python -m unittest discover -s tests -p "test_data_cham_anh_backfill.py"

      - name: Validate required credentials
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOBIWORK_USER"
          test -n "$MOBIWORK_TOKEN"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.dry_run }}" != "true" ]; then
            test -n "$AZURE_CLIENT_ID"
            test -n "$AZURE_TENANT_ID"
          fi

      - name: Azure login with GitHub OIDC
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint document library
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        uses: ./.github/actions/resolve-sharepoint-drive

      - name: Reconcile completed historical months
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          MOBIWORK_MIN_INTERVAL_SECONDS: "1.5"
          MOBIWORK_MAX_RETRIES: "8"
          MOBIWORK_TIMEOUT_SECONDS: "120"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          HISTORY_START_MONTH: ${{ github.event_name == 'workflow_dispatch' && inputs.start_month || '2026-06' }}
          HISTORY_END_MONTH: ${{ github.event_name == 'workflow_dispatch' && inputs.end_month || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python src/reconcile_history.py

      - name: Resolve Data cham anh historical range
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        id: data_range
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_START_MONTH: ${{ inputs.start_month }}
          INPUT_END_MONTH: ${{ inputs.end_month }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          previous_month = (today.replace(day=1) - timedelta(days=1)).strftime("%Y-%m")
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              start_month = os.environ.get("INPUT_START_MONTH", "").strip() or "2026-06"
              end_month = os.environ.get("INPUT_END_MONTH", "").strip() or previous_month
          else:
              start_month = "2026-06"
              end_month = previous_month

          print(f"from_month={start_month}")
          print(f"to_month={end_month}")
          PY

      - name: Refresh Data cham anh historical workbooks
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          DATA_CHAM_ANH_ROOT_FOLDER: "05_DataChamAnh"
          DATA_CHAM_ANH_FROM_MONTH: ${{ steps.data_range.outputs.from_month }}
          DATA_CHAM_ANH_TO_MONTH: ${{ steps.data_range.outputs.to_month }}
          DATA_CHAM_ANH_MAX_MONTHS: "120"
        run: python src/run_data_cham_anh_backfill.py

      - name: Publish reconciliation summary
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/sync_manifest.json")
          if not path.exists():
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          lines = [
              "## MobiWork historical reconciliation",
              "",
              f"- Status: **{data.get('status', 'unknown')}**",
              f"- Complete: **{data.get('history_reconcile_complete', False)}**",
              f"- Range: **{data.get('start_month', '')} → {data.get('end_month', '')}**",
              f"- Months completed: **{data.get('month_count_completed', 0)}/{data.get('month_count_expected', 0)}**",
              f"- Failed report executions: **{data.get('failed_report_count', 0)}**",
              f"- SharePoint writes: **{data.get('sharepoint_write_count', 0)}**",
              f"- Avoided no-op writes: **{data.get('sharepoint_write_avoided_count', 0)}**",
          ]
          if data.get("failed_month"):
              lines.append(f"- Failed month: **{data['failed_month']}**")
          if data.get("error"):
              lines.append(f"- Error: `{data['error']}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload reconciliation manifests
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobiwork-history-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/sync_manifest.json
            output/data_cham_anh_backfill_manifest.json
          if-no-files-found: ignore
          retention-days: 7
