name: MobiWork Full Month Rebuild

on:
  workflow_dispatch:
    inputs:
      target_month:
        description: "Month to rebuild as YYYY-MM; blank means current month"
        required: false
        default: ""
      dry_run:
        description: "Fetch/export only; do not upload to SharePoint"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Full-month recovery shares the production writer lock with routine sync/image jobs.
# Never cancel an active holder: an interrupted writer can leave only some reports
# updated. The rebuild waits for the lock, then repairs the month from source API.
concurrency:
  group: mobiwork-sharepoint-production
  cancel-in-progress: false

# Production SharePoint target. Override with repository variables
# (Settings → Secrets and variables → Actions → Variables) instead of editing
# every workflow; the literals are the current production defaults.
env:
  SHAREPOINT_HOST: ${{ vars.SHAREPOINT_HOST || 'vikodacomvn.sharepoint.com' }}
  SHAREPOINT_SITE_PATH: ${{ vars.SHAREPOINT_SITE_PATH || '/sites/Planning' }}
  SHAREPOINT_LIBRARY: ${{ vars.SHAREPOINT_LIBRARY || 'MobiWorkDMS' }}
  # Python Graph clients mint a fresh GitHub OIDC assertion per token request
  # (see src/sharepoint.py) so long runs never outlive the azure/login assertion.
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and test rebuild command
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p "test_mobiwork.py"
          python -m unittest discover -s tests -p "test_region_mapping.py"
          python -m unittest discover -s tests -p "test_monthly_master.py"
          python -m unittest discover -s tests -p "test_rebuild_month.py"
          python -m unittest discover -s tests -p "test_data_cham_anh_export.py"
          python -m unittest discover -s tests -p "test_data_cham_anh_runner.py"
          python -m unittest discover -s tests -p "test_data_cham_anh_backfill.py"

      - name: Validate required credentials
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOBIWORK_USER"
          test -n "$MOBIWORK_TOKEN"
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            test -n "$AZURE_CLIENT_ID"
            test -n "$AZURE_TENANT_ID"
          fi

      - name: Azure login with GitHub OIDC
        if: ${{ inputs.dry_run == false }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint document library
        if: ${{ inputs.dry_run == false }}
        uses: ./.github/actions/resolve-sharepoint-drive

      - name: Rebuild monthly masters from MobiWork API
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          # Recovery must remain usable while bootstrap readiness is false.
          BOOTSTRAP_BYPASS_GATE: "true"
          EMPLOYEE_REGION_STRICT: "false"
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          MOBIWORK_MIN_INTERVAL_SECONDS: "1.5"
          MOBIWORK_MAX_RETRIES: "8"
          MOBIWORK_TIMEOUT_SECONDS: "120"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          TARGET_MONTH: ${{ inputs.target_month }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python src/rebuild_month.py

      - name: Refresh Data cham anh for rebuilt month
        if: ${{ inputs.dry_run == false }}
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          DATA_CHAM_ANH_ROOT_FOLDER: "05_DataChamAnh"
          DATA_CHAM_ANH_FROM_MONTH: ${{ inputs.target_month }}
          DATA_CHAM_ANH_TO_MONTH: ${{ inputs.target_month }}
          DATA_CHAM_ANH_MAX_MONTHS: "1"
        run: python src/run_data_cham_anh_backfill.py

      - name: Upload rebuild manifests
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobiwork-rebuild-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/sync_manifest.json
            output/data_cham_anh_backfill_manifest.json
          if-no-files-found: ignore
          retention-days: 7
