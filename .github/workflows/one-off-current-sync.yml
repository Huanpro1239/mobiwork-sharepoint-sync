name: One-off Current MobiWork Sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-off-current-sync.yml"

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: mobiwork-sharepoint-production
  cancel-in-progress: false

jobs:
  one_off_sync:
    if: ${{ contains(github.event.head_commit.message, '[one-off-current-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Production preflight
        run: |
          python -m compileall -q src
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("config/reports.json").read_text(encoding="utf-8"))
          reports = payload.get("reports")
          if not isinstance(reports, list) or not any(item.get("enabled") for item in reports):
              raise SystemExit("No enabled reports in config/reports.json")
          print(f"Enabled reports: {sum(bool(item.get('enabled')) for item in reports)}")
          PY

      - name: Validate production secrets
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MOBIWORK_USER MOBIWORK_TOKEN AZURE_CLIENT_ID AZURE_TENANT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing or unavailable."
              exit 1
            fi
          done
          echo "Production credentials: available"

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint document library
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID=$(az rest \
            --method get \
            --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' \
            --query id -o tsv)
          DRIVES=$(az rest \
            --method get \
            --url "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            --output json)
          DRIVE_ID=$(echo "$DRIVES" | jq -r '.value[] | select((.name | ascii_downcase) == "mobiworkdms") | .id' | head -n 1)
          if [ -z "$DRIVE_ID" ] || [ "$DRIVE_ID" = "null" ]; then
            echo "::error::Microsoft Graph did not return a document library named MobiWorkDMS."
            exit 1
          fi
          echo "SHAREPOINT_DRIVE_ID=$DRIVE_ID" >> "$GITHUB_ENV"

      - name: Sync current day now
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          MOBIWORK_MIN_INTERVAL_SECONDS: "1.5"
          MOBIWORK_MAX_RETRIES: "8"
          MOBIWORK_TIMEOUT_SECONDS: "120"
          SHAREPOINT_HOST: "vikodacomvn.sharepoint.com"
          SHAREPOINT_SITE_PATH: "/sites/Planning"
          SHAREPOINT_LIBRARY: "MobiWorkDMS"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          SYNC_MODE: "incremental"
          SYNC_SCOPE: "today"
          LOOKBACK_DAYS: "1"
          DRY_RUN: "false"
        run: python src/run_all_reports.py

      - name: Publish one-off result status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
          else
            state="failure"
          fi
          description=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path("output/sync_manifest.json")
          if not path.exists():
              print("one-off current sync: no manifest")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              ok = data.get("successful_report_count", 0)
              failed = data.get("failed_report_count", 0)
              files = data.get("file_count", len(data.get("files", [])))
              print(f"one-off current sync: ok={ok} failed={failed} files={files}")
          PY
          )
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "one-off-current-sync" \
            --arg description "$description" \
            --arg target_url "$RUN_URL" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
