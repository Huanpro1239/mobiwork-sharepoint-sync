name: MobiWork Image Reconciliation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read SharePoint visit data and count image links only"
        required: true
        type: boolean
        default: true
      from_date:
        description: "Optional repair/backfill start date (YYYY-MM-DD)"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "35 2 * * 0"
      timezone: "Asia/Ho_Chi_Minh"
  push:
    branches:
      - main
    paths:
      - ".github/image-reconcile-now"

permissions:
  contents: read
  id-token: write

# Share the same production lock as the hourly data/image workflow. A reconciliation
# must never write Data anh while the hourly pipeline is writing the same library.
concurrency:
  group: mobiwork-sharepoint-production
  cancel-in-progress: false

jobs:
  reconcile-images:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Resolve reconciliation window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FROM_DATE: ${{ inputs.from_date }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            force_from_date="${INPUT_FROM_DATE:-}"
          else
            force_from_date=$(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          first_this_month = today.replace(day=1)
          previous_month = (first_this_month - timedelta(days=1)).replace(day=1)
          print(previous_month.isoformat())
          PY
            )
          fi

          echo "IMAGE_FORCE_FROM_DATE=$force_from_date" >> "$GITHUB_ENV"
          if [ -n "$force_from_date" ]; then
            echo "Reconciliation start date: $force_from_date"
          else
            echo "No forced start date; state-based incremental scan requested"
          fi

      - name: Validate MobiWork image credentials
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$MOBIWORK_USER" ]; then
            echo "::error::MOBIWORK_USER/MOBIWORK_USER_ID is missing or unavailable."
            missing=1
          fi
          if [ -z "$MOBIWORK_TOKEN" ]; then
            echo "::error::MOBIWORK_TOKEN is missing or unavailable."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "MobiWork image credentials: available"

      - name: Validate Microsoft OIDC configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::error::AZURE_CLIENT_ID is missing."
            missing=1
          fi
          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::AZURE_TENANT_ID is missing."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Microsoft OIDC configuration: available"

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint document library
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID=$(az rest \
            --method get \
            --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' \
            --query id -o tsv)

          DRIVES=$(az rest \
            --method get \
            --url "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            --output json)

          DRIVE_ID=$(echo "$DRIVES" | jq -r '.value[] | select((.name | ascii_downcase) == "mobiworkdms") | .id' | head -n 1)
          if [ -z "$DRIVE_ID" ] || [ "$DRIVE_ID" = "null" ]; then
            echo "::error::Microsoft Graph did not return a document library named MobiWorkDMS."
            exit 1
          fi

          echo "SHAREPOINT_DRIVE_ID=$DRIVE_ID" >> "$GITHUB_ENV"
          echo "MobiWorkDMS drive id resolved"

      - name: Reconcile images from persisted SharePoint visit data
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          SHAREPOINT_HOST: "vikodacomvn.sharepoint.com"
          SHAREPOINT_SITE_PATH: "/sites/Planning"
          SHAREPOINT_LIBRARY: "MobiWorkDMS"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          IMAGE_SYNC_ENABLED: "true"
          IMAGE_SOURCE_REPORT: "visit"
          IMAGE_ROOT_FOLDER: "Data anh"
          IMAGE_URL_FIELD: "hinh_anh"
          IMAGE_DATE_FIELD: "ngay"
          IMAGE_EMPLOYEE_FIELD: "ten_nhan_vien"
          IMAGE_CUSTOMER_FIELD: "ma_kh"
          IMAGE_SEQUENCE_FIELD: "stt_hinh"
          IMAGE_REQUIRE_GHI_TON: "false"
          IMAGE_REQUEST_TIMEOUT_SECONDS: "30"
          IMAGE_MAX_DOWNLOAD_RETRIES: "2"
          IMAGE_MAX_BYTES: "20971520"
          IMAGE_ALLOWED_HOSTS: "dmsimages.mobiwork.vn"
          IMAGE_FORCE_FROM_DATE: ${{ env.IMAGE_FORCE_FROM_DATE }}
          # A reconciliation is an integrity check. Any remaining image failure should
          # make this workflow red while still publishing its manifest for diagnosis.
          IMAGE_FAIL_ON_PARTIAL: "true"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python src/run_images.py

      - name: Publish image reconciliation summary
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/image_sync_manifest.json")
          if not path.exists():
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8"))
          image = data.get("image_sync", {})
          lines = [
              "## MobiWork Image Reconciliation",
              "",
              f"- Status: **{data.get('status', 'unknown')}**",
              f"- Source mode: `{data.get('source_mode', '')}`",
              f"- Vietnam date: `{data.get('today_vn', '')}`",
              f"- Scan range: `{image.get('from_date', '')}` → `{image.get('to_date', '')}`",
              f"- Forced start: `{image.get('forced_from_date') or 'none'}`",
              f"- Source workbooks: **{len(image.get('source_files', []))}**",
              f"- Retained months: `{', '.join(image.get('retained_months', []))}`",
              f"- Records scanned: **{int(image.get('records_scanned', 0)):,}**",
              f"- Expected image links: **{int(image.get('candidate_count', 0)):,}**",
              f"- Missing images repaired: **{int(image.get('uploaded_count', 0)):,}**",
              f"- Already present: **{int(image.get('skipped_existing_count', 0)):,}**",
              f"- Remaining failures: **{int(image.get('failed_count', 0)):,}**",
              f"- Downloaded bytes: **{int(image.get('downloaded_bytes', 0)):,}**",
              f"- Duration: **{image.get('duration_seconds', 0)} s**",
              f"- Retry from date: `{image.get('retry_from_date') or 'none'}`",
          ]
          if data.get("error"):
              lines.append(f"- Error: `{data['error']}`")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload image reconciliation manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mobiwork-image-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/image_sync_manifest.json
          if-no-files-found: ignore
          retention-days: 30
