name: MobiWork Daily Image Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read SharePoint visit data and count image links only"
        required: true
        type: boolean
        default: true
      from_date:
        description: "Optional repair/backfill start date (YYYY-MM-DD)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/image-reconcile-now"

permissions:
  contents: read
  id-token: write
  actions: write

# Image writes share the same production lock as the report pipeline so Data anh
# is never modified concurrently with SharePoint monthly master updates. Active
# runs are not cancelled; resumable checkpoints preserve unfinished image work.
concurrency:
  group: mobiwork-sharepoint-production
  cancel-in-progress: false

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve incremental or repair window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FROM_DATE: ${{ inputs.from_date }}
        run: |
          set -euo pipefail

          # Explicit manual backfills remain authoritative.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_FROM_DATE:-}" ]; then
            force_from_date="$INPUT_FROM_DATE"
            mode="manual-backfill"
          elif [ "$EVENT_NAME" = "push" ]; then
            # Marker pushes intentionally reconcile the complete retained window.
            # The reliable reconciler uses folder indexes + bounded batches, so this
            # is now safe and is the fastest way to repair historical holes.
            force_from_date=$(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          first_this_month = today.replace(day=1)
          previous_month = (first_this_month - timedelta(days=1)).replace(day=1)
          print(previous_month.isoformat())
          PY
            )
            mode="full-retained-reconcile"
          else
            # Scheduled production is dispatched by mobiwork-sync.yml only after the
            # finalized yesterday report refresh succeeds. Catch-up batches reuse
            # Data anh/_state.json and honor retry_from_date.
            force_from_date=""
            mode="incremental-state"
          fi

          echo "IMAGE_FORCE_FROM_DATE=$force_from_date" >> "$GITHUB_ENV"
          echo "IMAGE_SYNC_WINDOW_MODE=$mode" >> "$GITHUB_ENV"
          echo "Image sync window mode: $mode"
          echo "Forced start: ${force_from_date:-state cursor}"

      - name: Validate MobiWork image credentials
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$MOBIWORK_USER" ]; then
            echo "::error::MOBIWORK_USER/MOBIWORK_USER_ID is missing or unavailable."
            missing=1
          fi
          if [ -z "$MOBIWORK_TOKEN" ]; then
            echo "::error::MOBIWORK_TOKEN is missing or unavailable."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "MobiWork image credentials: available"

      - name: Validate Microsoft OIDC configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::error::AZURE_CLIENT_ID is missing."
            missing=1
          fi
          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::AZURE_TENANT_ID is missing."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Microsoft OIDC configuration: available"

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint document library
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID=$(az rest \
            --method get \
            --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' \
            --query id -o tsv)

          DRIVES=$(az rest \
            --method get \
            --url "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            --output json)

          DRIVE_ID=$(echo "$DRIVES" | jq -r '.value[] | select((.name | ascii_downcase) == "mobiworkdms") | .id' | head -n 1)
          if [ -z "$DRIVE_ID" ] || [ "$DRIVE_ID" = "null" ]; then
            echo "::error::Microsoft Graph did not return a document library named MobiWorkDMS."
            exit 1
          fi

          echo "SHAREPOINT_DRIVE_ID=$DRIVE_ID" >> "$GITHUB_ENV"
          echo "MobiWorkDMS drive id resolved"

      - name: Sync images from SharePoint visit data
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          SHAREPOINT_HOST: "vikodacomvn.sharepoint.com"
          SHAREPOINT_SITE_PATH: "/sites/Planning"
          SHAREPOINT_LIBRARY: "MobiWorkDMS"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          IMAGE_SYNC_ENABLED: "true"
          IMAGE_SOURCE_REPORT: "visit"
          IMAGE_ROOT_FOLDER: "Data anh"
          IMAGE_URL_FIELD: "hinh_anh"
          IMAGE_DATE_FIELD: "ngay"
          IMAGE_EMPLOYEE_FIELD: "ten_nhan_vien"
          IMAGE_CUSTOMER_FIELD: "ma_kh"
          IMAGE_SEQUENCE_FIELD: "stt_hinh"
          IMAGE_REQUIRE_GHI_TON: "false"
          IMAGE_REQUEST_TIMEOUT_SECONDS: "30"
          IMAGE_MAX_DOWNLOAD_RETRIES: "4"
          IMAGE_MAX_BYTES: "20971520"
          # MobiWork may redirect legacy image links to this CDN host.
          IMAGE_ALLOWED_HOSTS: "dmsimages.mobiwork.vn,image2.mobiwork.vn"
          IMAGE_FORCE_FROM_DATE: ${{ env.IMAGE_FORCE_FROM_DATE }}
          IMAGE_SYNC_MAX_UPLOADS_PER_RUN: "1500"
          # A small number of bad source-image URLs must not make the whole workflow
          # fail before the recovery workflow can classify them. The manifest remains
          # authoritative and still records every failed image plus retry_from_date.
          IMAGE_FAIL_ON_PARTIAL: "false"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python src/run_images.py

      - name: Publish daily image sync summary
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/image_sync_manifest.json")
          if not path.exists():
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8"))
          image = data.get("image_sync", {})
          lines = [
              "## MobiWork Daily Image Sync",
              "",
              f"- Status: **{data.get('status', 'unknown')}**",
              f"- Source mode: `{data.get('source_mode', '')}`",
              f"- Window mode: `{os.environ.get('IMAGE_SYNC_WINDOW_MODE', '')}`",
              f"- Vietnam date: `{data.get('today_vn', '')}`",
              f"- Scan range: `{image.get('from_date', '')}` → `{image.get('to_date', '')}`",
              f"- Forced start: `{image.get('forced_from_date') or 'state cursor'}`",
              f"- Source workbooks: **{len(image.get('source_files', []))}**",
              f"- Retained months: `{', '.join(image.get('retained_months', []))}`",
              f"- Records scanned: **{int(image.get('records_scanned', 0)):,}**",
              f"- Raw image links: **{int(image.get('candidate_count', 0)):,}**",
              f"- Unique image targets: **{int(image.get('unique_target_count', 0)):,}**",
              f"- Duplicate source rows removed: **{int(image.get('duplicate_candidate_count', 0)):,}**",
              f"- Already present: **{int(image.get('skipped_existing_count', 0)):,}**",
              f"- Downloaded this batch: **{int(image.get('uploaded_count', 0)):,}**",
              f"- Deferred to next batch: **{int(image.get('deferred_count', 0)):,}**",
              f"- Download failures: **{int(image.get('failed_count', 0)):,}**",
              f"- Pending remaining: **{int(image.get('pending_remaining', 0)):,}**",
              f"- Completeness: **{float(image.get('completeness_pct', 0)):.4f}%**",
              f"- SharePoint folder listings: **{int(image.get('remote_folder_list_calls', 0)):,}**",
              f"- Folder listing failures: **{int(image.get('remote_folder_list_failures', 0)):,}**",
              f"- Downloaded bytes: **{int(image.get('downloaded_bytes', 0)):,}**",
              f"- Duration: **{image.get('duration_seconds', 0)} s**",
              f"- Retry from date: `{image.get('retry_from_date') or 'none'}`",
          ]
          if data.get("error"):
              lines.append(f"- Error: `{data['error']}`")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Continue image catch-up
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path="output/image_sync_manifest.json"
          if [ ! -f "$path" ]; then
            exit 0
          fi

          status=$(jq -r '.status // "unknown"' "$path")
          uploaded=$(jq -r '.image_sync.uploaded_count // 0' "$path")
          pending=$(jq -r '.image_sync.pending_remaining // 0' "$path")
          retry_from=$(jq -r '.image_sync.retry_from_date // ""' "$path")

          echo "Image catch-up: status=$status uploaded=$uploaded pending=$pending retry_from=$retry_from"
          if [ "$status" != "warming_up" ] && [ "$status" != "partial_failure" ]; then
            exit 0
          fi
          if [ "$pending" -le 0 ]; then
            exit 0
          fi
          if [ -z "$retry_from" ] || [ "$retry_from" = "null" ]; then
            echo "::error::$status manifest has pending work but no retry_from_date"
            exit 1
          fi

          # Continue immediately only while the previous batch made forward progress.
          # A persistent broken URL with zero uploads is left checkpointed for the next
          # normal production pass instead of creating an infinite dispatch loop.
          if [ "$uploaded" -le 0 ]; then
            echo "No forward image progress in this batch; keeping retry cursor for the next production pass."
            exit 0
          fi

          python - "$retry_from" > /tmp/image-dispatch.json <<'PY'
          import json
          import sys

          print(json.dumps({
              "ref": "main",
              "inputs": {"dry_run": "false", "from_date": sys.argv[1]},
          }))
          PY

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/mobiwork-images.yml/dispatches" \
            --input /tmp/image-dispatch.json
          echo "Requested next image catch-up batch from $retry_from"

      - name: Upload daily image sync manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mobiwork-daily-image-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/image_sync_manifest.json
          if-no-files-found: ignore
          retention-days: 30
