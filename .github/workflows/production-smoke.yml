name: MobiWork Production Smoke

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Business date to validate (YYYY-MM-DD); blank = yesterday Vietnam time"
        required: false
        default: ""
  schedule:
    - cron: "30 11 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: read
  id-token: write

concurrency:
  group: mobiwork-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Validate production credentials
        env:
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MOBIWORK_USER MOBIWORK_TOKEN AZURE_CLIENT_ID AZURE_TENANT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing or unavailable"
              exit 1
            fi
          done

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint document library
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID=$(az rest \
            --method get \
            --url 'https://graph.microsoft.com/v1.0/sites/vikodacomvn.sharepoint.com:/sites/Planning?$select=id' \
            --query id -o tsv)
          DRIVES=$(az rest \
            --method get \
            --url "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            --output json)
          DRIVE_ID=$(echo "$DRIVES" | jq -r '.value[] | select((.name | ascii_downcase) == "mobiworkdms") | .id' | head -n 1)
          if [ -z "$DRIVE_ID" ] || [ "$DRIVE_ID" = "null" ]; then
            echo "::error::Microsoft Graph did not return a document library named MobiWorkDMS."
            exit 1
          fi
          echo "SHAREPOINT_DRIVE_ID=$DRIVE_ID" >> "$GITHUB_ENV"

      - name: Compare MobiWork with SharePoint production data
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
          MOBIWORK_USER: ${{ secrets.MOBIWORK_USER || secrets.MOBIWORK_USER_ID }}
          MOBIWORK_TOKEN: ${{ secrets.MOBIWORK_TOKEN }}
          MOBIWORK_MIN_INTERVAL_SECONDS: "1.5"
          MOBIWORK_MAX_RETRIES: "6"
          MOBIWORK_TIMEOUT_SECONDS: "120"
          SHAREPOINT_HOST: "vikodacomvn.sharepoint.com"
          SHAREPOINT_SITE_PATH: "/sites/Planning"
          SHAREPOINT_LIBRARY: "MobiWorkDMS"
          SHAREPOINT_DRIVE_ID: ${{ env.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_MAX_RETRIES: "6"
          SHAREPOINT_TIMEOUT_SECONDS: "120"
          SMOKE_TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
        run: python src/production_smoke.py

      - name: Publish smoke summary
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/production_smoke_manifest.json")
          if not path.exists():
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          lines = [
              "## MobiWork production smoke",
              "",
              f"- Status: **{data.get('status', 'unknown')}**",
              f"- Target date: **{data.get('target_date', '')}**",
              f"- Reports passed: **{data.get('successful_report_count', 0)}**",
              f"- Reports failed: **{data.get('failed_report_count', 0)}**",
              "",
              "| Report | Status | Source rows | Compared rows |",
              "|---|---|---:|---:|",
          ]
          for item in data.get("reports", []):
              lines.append(
                  f"| {item.get('report', '')} | {item.get('status', '')} | "
                  f"{int(item.get('source_rows', 0)):,} | {int(item.get('compared_rows', 0)):,} |"
              )
              if item.get("error"):
                  lines.append(f"| ↳ error | `{item['error']}` |  |  |")
          image = data.get("image_state", {})
          lines.extend([
              "",
              "### Image state",
              f"- Last completed: `{image.get('last_completed_sync_date', '')}`",
              f"- Failed count: **{image.get('failed_count', 0)}**",
              f"- Retry from: `{image.get('retry_from_date') or ''}`",
          ])
          if image.get("error"):
              lines.append(f"- Error: `{image['error']}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload smoke manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/production_smoke_manifest.json
          if-no-files-found: ignore
          retention-days: 14
